const LV_TITLES=[[1,'Cadetto'],[3,'Pilota'],[5,'Esploratore'],[8,'Capitano'],[11,'Comandante'],[15,'Ammiraglio'],[20,'Leggenda galattica']];
function level(xp){let lv=1,need=60,acc=0;while(xp>=acc+need){acc+=need;lv++;need=60+lv*30}let t='';LV_TITLES.forEach(([n,s])=>{if(lv>=n)t=s});return{lv,cur:xp-acc,need,title:t}}
function xpFor(v){return 10+(v>=6?5:0)+(v>=7?5:0)+(v>=8?5:0)+(v>=9?10:0)+(v>=10?15:0)}
const RAR={comune:{n:'Comune',c:'#9AACD6',xp:20},raro:{n:'Raro',c:'#4CC9F0',xp:50},epico:{n:'Epico',c:'#B197FC',xp:100},leggendario:{n:'Leggendario',c:'#FFC145',xp:250}};
const RORD=['comune','raro','epico','leggendario'];

/* ===================== TRAGUARDI ===================== */
function byT(x,y){return x.date.localeCompare(y.date)||(x.ts||0)-(y.ts||0)}
function dowOf(d){return(new Date(d+'T12:00').getDay()+6)%7}
function weekKey(d){const t=new Date(d+'T12:00');t.setDate(t.getDate()-dowOf(d));return t.toISOString().slice(0,10)}
function runLen(g,f){let best=g.length?1:0,c=1;for(let i=1;i<g.length;i++){c=f(g[i-1],g[i])?c+1:1;if(c>best)best=c}return best}
function bctx(ev){
  const a=allGrades();
  const subs=S.subjects.map(s=>({s,g:s.grades.slice().sort(byT),a:avg(s.grades)})).filter(x=>x.g.length);
  const gen=subs.length?subs.reduce((t,x)=>t+x.a,0)/subs.length:null;
  return{a,subs,gen,st:streak(),ev:ev||{}};
}
function bDone(b,c){if(b.ok)return!!b.ok(c);const p=b.p(c);return p[0]>=p[1]}
function checkBadges(ev){
  const c=bctx(ev),nw=[];S.bdates=S.bdates||{};
  BADGES.forEach(b=>{if(!S.badges.includes(b.id)&&bDone(b,c)){S.badges.push(b.id);S.bdates[b.id]=today();S.xp=(S.xp||0)+RAR[b.r].xp;nw.push(b.id)}});
  return nw;
}
function initProgress(){
  const map={serie5:'fiamme',serie10:'cometa',tutte6:'scudo',venti:'archivista'};
  S.badges=[...new Set((S.badges||[]).map(id=>map[id]||id))].filter(id=>BADGES.some(b=>b.id===id));
  S.bdates=S.bdates||{};
  if(S.xp==null){S.xp=allGrades().reduce((t,g)=>t+xpFor(g.v),0)+S.badges.reduce((t,id)=>t+RAR[BADGES.find(b=>b.id===id).r].xp,0)}
}
function medal(b,unlocked,size){
  const col=RAR[b.r].c,hidden=b.hid&&!unlocked;

}
function levelCard(){

}
function badgesGrid(){
  const c=bctx();let h='';
  RORD.forEach(r=>{
    const list=BADGES.filter(b=>b.r===r),got=list.filter(b=>S.badges.includes(b.id)).length;

function openBadge(id){
  const b=BADGES.find(x=>x.id===id);if(!b)return;

function freshMsg(tier,s,v,label){

  if(now.getHours()>=22||now.getHours()<5)extra.push("Anche a quest'ora pensi ai voti? Rispetto.");

function celebrate(v,label,s,before,after,per,info){
  info=info||{};const nb=info.nb||[],xp0=info.xp0||0,gain=info.gain||0;
  const tier=v>=9?'top':v>=8?'high':v>=6?'ok':v>=5?'near':'low';
  const mood=v>=8?'ecstatic':v>=6?'happy':v>=5?'determined':'sad';
  const [t,sub]=freshMsg(tier,s,v,label);
  let ctx='';
  if(before!=null&&before<6&&after>=6)ctx=`🎉 Hai portato ${esc(s.name)} sopra il 6!`;
  else if(before!=null&&before>=6&&after<6){const x=needed1(s,per);ctx=x<=10?`Per tornare a 6 ti serve almeno ${fmtQ(x)} nella prossima`:`Media ${fmt(after)}, servono un paio di voti per risalire`;}
  else if(before!=null&&after>before+0.005)ctx=`Media di ${esc(s.name)}: ${fmt(before)} → ${fmt(after)} 📈`;

function viewNeed(){
  const rows=S.subjects.filter(s=>gradesOf(s).length).map(s=>({s,a:subjAvg(s)}));
  if(!rows.length)return `<div class="empty"><div class="em">🎯</div><p>Inserisci qualche voto e qui vedrai quanto ti serve in ogni materia</p></div>`;
  S.kSub=S.kSub||{};
  const gen=generale(),n=rows.length;
  let best=null;rows.forEach(r=>{const na=avg(gradesOf(r.s).concat([{v:8,w:100}])),d=(na-r.a)/n;if(d>0.004&&(!best||d>best.d))best={s:r.s,d}});
  let h=`<div class="gcard"><div class="gl"><span>Media generale</span><b class="c-${tone(gen)}">${fmt(gen)}</b></div><p>${best?`Un 8 alla prossima di <b>${esc(best.s.name)}</b> alza la tua media generale di <b>+${fmt(Math.round(best.d*100)/100)}</b>, più che in qualsiasi altra materia.`:'Sei già altissimo: un 8 non alzerebbe la tua media generale. Punta ai 9 e ai 10!'}</p></div>`;
  rows.sort((x,y)=>x.a-y.a);

  const card=({s,a})=>{
    const k=S.kSub[s.id]||2;let pill,lab,d,t;
    if(a<6){
      const x=needed(s,6,k);
      if(x>10){let kk=k;while(kk<20&&needed(s,6,kk)>10)kk++;pill='✕';lab='non basta';t='red';d=`Per arrivare al 6 non bastano ${k} verifiche: te ne servono almeno ${kk}.`}
      else{pill=fmtQ(x);lab='per il 6';t=x<=6.5?'green':x<=8?'amber':'red';d=`Per arrivare al 6 ti serve almeno ${fmtQ(x)} ${kTxt(k)}.`}

      else{const x=needed(s,pag+.5,k);pill=x<=10?fmtQ(x):'✕';lab=`per il ${pag+1}`;t=x<=10?(x<=7?'green':x<=8.5?'amber':'red'):'red';
        const y=needed(s,6,k);
        d=(x<=10?`Ora in pagella avresti ${pag}. Per avere ${pag+1} ti serve almeno ${fmtQ(x)} ${kTxt(k)}.`:`Ora in pagella avresti ${pag}. Il ${pag+1} con ${k} ${k===1?'verifica':'verifiche'} non è raggiungibile.`)+(y>1?` Per restare sopra il 6 non scendere sotto ${fmtQ(y)}.`:'')}
    }
    return `<div class="ncard"><div class="nh"><div class="ico" style="${icoStyle(s)}">${emojiOf(s.name)}</div><div class="nn"><b>${esc(s.name)}</b><span>Media ${fmt(a)}</span></div><div class="need"><span>${lab}</span><b class="t-${t}">${pill}</b></div></div>
    <p class="nd">${d}</p>
    <div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,a*10))}%;background:var(--${tone(a)})"></div><div class="tg" style="left:60%"></div></div>

  };

  if(over.length)h+=`<div class="sechead"><h2>Per alzare la media</h2></div><div class="list">${over.map(card).join('')}</div>`;

function buzz(p){if(S.haptics===false)return;try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
document.addEventListener('click',e=>{if(e.target.closest('.keypad button,.mods button,.step button'))buzz(5)},true);

let actx=null;
function tone2(f,t0,d,type,vol){const o=actx.createOscillator(),g=actx.createGain();o.type=type||'triangle';o.frequency.value=f;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol||.16,t0+.012);g.gain.exponentialRampToValueAtTime(.0008,t0+d);o.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+d+.05)}
function sfx(kind){
  if(S.sound===false)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){return}
  const t=actx.currentTime+.02,N=n=>440*Math.pow(2,(n-69)/12);
  const seq=(notes,step,d,type,vol)=>notes.forEach((n,i)=>tone2(N(n),t+i*step,d,type,vol));
  if(kind==='low')seq([67,62],.14,.35,'sine',.12);
  else if(kind==='ok')seq([72,76],.09,.35,'triangle');
  else if(kind==='great')seq([72,76,79,84],.075,.45,'triangle');
  else if(kind==='level'){seq([67,72,76,79],.11,.5,'square',.06);seq([84],.0,.0,'sine',0);tone2(N(84),t+.46,.9,'triangle',.18)}
  else if(kind==='comune')seq([79,84],.08,.4,'sine',.15);
  else if(kind==='raro')seq([76,81,88],.08,.5,'sine',.15);
  else if(kind==='epico'){seq([72,79,84,91],.07,.6,'triangle',.13);seq([96],.0,.8,'sine',0)}
  else if(kind==='leggendario'){seq([60,67,72,76,79,84],.08,.7,'triangle',.12);[88,91,96].forEach((n,i)=>tone2(N(n),t+.55+i*.06,.9,'sine',.08))}
  else if(kind==='mission')seq([74,78,81],.08,.45,'triangle',.14);
}

function weekRange(){const s=weekKey(today()),e=new Date(s+'T12:00');e.setDate(e.getDate()+6);return[s,isoD(e)]}
function hashStr(x){let h=2166136261;for(const ch of x){h^=ch.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function activeMissions(){
  const wk=weekKey(today());if(!S.mis||S.mis.wk!==wk)S.mis={wk,done:[]};
  let seed=hashStr(wk+'pagella');const pool=MISSIONS.slice();const out=[];
  while(out.length<3&&pool.length){seed=(Math.imul(seed,1103515245)+12345)>>>0;out.push(pool.splice(seed%pool.length,1)[0])}
  return out;
}
function misCtx(){const[s,e]=weekRange();return{g:allGrades().filter(g=>g.date>=s&&g.date<=e),days:(S.days||[]).filter(d=>d>=s&&d<=e).length}}
function checkMissions(){const act=activeMissions(),c=misCtx(),nw=[];act.forEach(m=>{if(!S.mis.done.includes(m.id)){const[x,mx]=m.f(c);if(x>=mx){S.mis.done.push(m.id);S.xp=(S.xp||0)+m.xp;nw.push(m.id)}}});return nw}
function missionsBlock(){
  const act=activeMissions(),c=misCtx(),[,e]=weekRange(),left=Math.max(0,daysTo(e)+1);
  return `<div class="sechead"><h2>Missioni della settimana</h2><span class="note" style="margin:0">⏳ ${left} ${left===1?'giorno':'giorni'}</span></div><div class="mlist">${act.map(m=>{const done=S.mis.done.includes(m.id);const[x,mx]=m.f(c);const p=done?100:Math.min(100,x/mx*100);
    return `<div class="mis ${done?'done':''}"><div class="mi">${done?'✅':'🎯'}</div><div class="mt"><b>${m.t}</b><div class="bprog big" style="margin-top:8px"><i style="width:${p}%;background:${done?'var(--green)':'linear-gradient(90deg,#FFC145,#FF8A3D)'}"></i></div></div><span class="mxp">+${m.xp} XP</span></div>`}).join('')}</div>`;
}
function missionScreen(id){const m=MISSIONS.find(x=>x.id===id);return{cls:'mis-c',html:`<div class="rays" style="--rc:#3DDBA4"></div><div class="cmas">${orbi('ecstatic',96,'pop')}</div><span class="rpill" style="--rc:#3DDBA4">Missione completata · +${m.xp} XP</span><h4>${esc(m.t)}</h4><p>Nuove missioni ogni lunedì!</p><div class="tap">Tocca per continuare</div>`,fx:()=>{buzz([20,30,20,30,60]);sfx('mission');confetti(110,false)}}}

/* ---------- Wrapped ---------- */
function openWrapped(){
  const gs=S.subjects.flatMap(s=>gradesOf(s).map(g=>({...g,s}))).sort(byT);
  if(gs.length<3){toast('Servono almeno 3 voti per il Wrapped');return}
  const plab=period==='all'?"quest'anno":period===1?'1° periodo':'2° periodo';
  const rows=S.subjects.map(s=>({s,a:subjAvg(s),g:gradesOf(s)})).filter(r=>r.a!=null);
  const gen=generale(),top=gs.reduce((b,g)=>g.v>b.v?g:b,gs[0]),best=rows.slice().sort((x,y)=>y.a-x.a)[0];
  const prog=rows.filter(r=>r.g.length>=2).map(r=>({...r,d:r.g[r.g.length-1].v-r.g[0].v})).sort((x,y)=>y.d-x.d)[0];
  const run=runLen(gs,(p,q)=>p.v>=6&&q.v>=6),maxRun=gs.some(g=>g.v>=6)?Math.max(run,1):0;
  const L=level(S.xp||0);
  const genMsg=gen>=8?'Livello: fuoriclasse 🚀':gen>=7?'Roba seria, complimenti 👏':gen>=6?'Sopra la linea, e si può solo salire 📈':'Il bello delle rimonte è che partono da qui 💪';
  const sl=[
    {bg:'#3D2BD1,#0B0F2A',h:`<div class="wo">${orbi('ecstatic',150)}</div><small>Pagella Wrapped</small><h2>Il tuo ${plab}</h2><p>Tocca per iniziare ▶</p>`},
    {bg:'#0EA77A,#06231D',h:`<small>In questo periodo hai preso</small><div class="wbig" data-wc="${gs.length}">0</div><h2>voti</h2><p>in ${rows.length} ${rows.length===1?'materia':'materie'} diverse</p>`},
    {bg:'#F2620F,#2A1206',h:`<small>La tua media generale</small><div class="wbig" data-wc="${gen}" data-dec="1">0</div><p>${genMsg}</p>`},
    {bg:'#DB2777,#2A0717',h:`<small>Il voto più bello</small><div class="wbig">${esc(top.label)}</div><h2>${emojiOf(top.s.name)} ${esc(top.s.name)}</h2><p>il ${dateIt(top.date)}. Te lo ricordi?</p>`},
    {bg:'#7C4DFF,#140A33',h:`<small>La tua materia top</small><div class="wemoji">${emojiOf(best.s.name)}</div><h2>${esc(best.s.name)}</h2><p>con una media di ${fmt(best.a)}</p>`},
    prog&&prog.d>0?{bg:'#0891B2,#03202A',h:`<small>Il miglior progresso</small><h2>${emojiOf(prog.s.name)} ${esc(prog.s.name)}</h2><div class="wbig">${esc(prog.g[0].label)} → ${esc(prog.g[prog.g.length-1].label)}</div><p>dal primo all'ultimo voto. Che rimonta!</p>`}:null,
    {bg:'#E8590C,#2B0F02',h:`<small>La tua serie più lunga</small><div class="wbig" data-wc="${maxRun}">0</div><h2>sufficienze di fila 🔥</h2>`},
    {bg:'#FFB020,#2A1C00',h:`<small>Il tuo viaggio</small><div class="wbig">Liv. ${L.lv}</div><h2>${L.title}</h2><p>🏅 ${S.badges.length} traguardi sbloccati</p>`},
    {bg:'#3D2BD1,#0B0F2A',h:`<div class="wo">${orbi('happy',140)}</div><h2>Alla prossima!</h2><p>Orbi è fiero di te.</p><button class="btn press" id="wShare">Condividi il Wrapped</button>`}
  ].filter(Boolean);
  const el=document.createElement('div');el.className='wrapped';
  el.innerHTML=`<div class="wbars">${sl.map(()=>'<i><b></b></i>').join('')}</div><button class="wx" aria-label="Chiudi">✕</button><div class="wslide"></div>`;
  document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('on'));
  let i=0,timer;
  const show=()=>{
    clearTimeout(timer);const s=sl[i];el.style.setProperty('--w1',s.bg.split(',')[0]);el.style.setProperty('--w2',s.bg.split(',')[1]);
    const box=el.querySelector('.wslide');box.innerHTML=`<div class="wcont">${s.h}</div>`;
    el.querySelectorAll('.wbars i').forEach((b,k)=>{b.className=k<i?'done':k===i?'cur':''});
    box.querySelectorAll('[data-wc]').forEach(n=>{const to=+n.dataset.wc;countUp(n,to,1100,v=>n.dataset.dec?fmt(Math.round(v*100)/100):Math.round(v))});
    buzz(8);
    const sh=box.querySelector('#wShare');if(sh)sh.onclick=async e=>{e.stopPropagation();const txt=`🎬 La mia Pagella Wrapped (${plab})\n📚 ${gs.length} voti in ${rows.length} materie\n📊 Media generale ${fmt(gen)}\n🌟 Voto più bello: ${top.label} in ${top.s.name}\n🏆 Materia top: ${best.s.name} (${fmt(best.a)})\n🔥 Serie più lunga: ${maxRun} sufficienze\n⚡ Livello ${L.lv} · ${L.title}`;try{if(navigator.share){await navigator.share({text:txt});return}}catch(er){return}try{await navigator.clipboard.writeText(txt);toast('Wrapped copiato')}catch(er){}};
    if(i<sl.length-1)timer=setTimeout(()=>{i++;show()},5200);
  };
  const close=()=>{clearTimeout(timer);el.classList.remove('on');setTimeout(()=>el.remove(),350)};
  el.querySelector('.wx').onclick=e=>{e.stopPropagation();close()};
  el.onclick=e=>{if(e.target.closest('#wShare'))return;const left=e.clientX<innerWidth*.3;if(left){if(i>0){i--;show()}}else if(i<sl.length-1){i++;show()}else close()};
  show();

/* ---------- celebrazioni con suoni, missioni e accessori ---------- */
function badgeScreen(id){
  const b=BADGES.find(x=>x.id===id),R=RAR[b.r];
  return{cls:'bunl',html:`<div class="rays" style="--rc:${R.c}"></div><div class="bpop">${medal(b,true,104)}</div><span class="rpill" style="--rc:${R.c}">${R.n} · +${R.xp} XP</span><h4>${esc(b.t)}</h4><p>${esc(b.d)}</p><div class="tap">Traguardo sbloccato · tocca per continuare</div>`,
    fx:()=>{buzz(RBUZZ[b.r]);sfx(b.r);if(!matchMedia('(prefers-reduced-motion: reduce)').matches)confetti(b.r==='leggendario'?220:130,b.r==='leggendario'||b.r==='epico')}};
}
function celebrate(v,label,s,before,after,per,info){
  info=info||{};const nb=info.nb||[],nm=info.nm||[],xp0=info.xp0||0,gain=info.gain||0;
  const tier=v>=9?'top':v>=8?'high':v>=6?'ok':v>=5?'near':'low';
  const mood=v>=8?'ecstatic':v>=6?'happy':v>=5?'determined':'sad';
  const [t,sub]=freshMsg(tier,s,v,label);
  let ctx='';
  if(before!=null&&before<6&&after>=6)ctx=`🎉 Hai portato ${esc(s.name)} sopra il 6!`;
  else if(before!=null&&before>=6&&after<6){const x=needed1(s,per);ctx=x<=10?`Per tornare a 6 ti serve almeno ${fmtQ(x)} nella prossima`:`Media ${fmt(after)}, servono un paio di voti per risalire`;}
  else if(before!=null&&after>before+0.005)ctx=`Media di ${esc(s.name)}: ${fmt(before)} → ${fmt(after)} 📈`;
  else if(before!=null&&after<before-0.005)ctx=`Media di ${esc(s.name)}: ${fmt(before)} → ${fmt(after)}`;
  else ctx=`Primo voto in ${esc(s.name)}`;
  const L0=level(xp0),L1=level(xp0+gain),up=L1.lv>L0.lv;
  celQ=[{cls:v<6?'low':'',html:`<div class="cmas">${orbi(mood,104,'pop')}</div><div class="gv t-${tone(v)}">${esc(label)}</div><h4>${t}</h4><p>${sub}</p><div class="ctx">${ctx}</div>
    <div class="xprow"><span class="xpchip">+<b>0</b> XP</span><div class="xpbar"><i style="width:${L0.cur/L0.need*100}%"></i></div><span class="xplv">Liv. ${L0.lv}</span></div><div class="tap">Tocca per continuare</div>`,
    fx:card=>{
      buzz(v>=8?[30,60,30,60,60]:v>=6?[30]:[15]);sfx(v>=8?'great':v>=6?'ok':'low');
      if(v>=6&&!matchMedia('(prefers-reduced-motion: reduce)').matches)confetti(v>=8?160:50,v>=9);
      const chip=card.querySelector('.xpchip b'),bar=card.querySelector('.xpbar i');
      setTimeout(()=>{if(!chip||!chip.isConnected)return;countUp(chip,gain,700,x=>Math.round(x));bar.style.width=(up?100:L1.cur/L1.need*100)+'%'},450);
    }}];
  const lvNow=level(S.xp||0).lv;
  if(up||lvNow>L0.lv){const Ln=level(S.xp||0),newAcc=ACC.filter(a=>a.lv>L0.lv&&a.lv<=Ln.lv);
    celQ.push({cls:'lvup',html:`<div class="rays" style="--rc:#7C6CFF"></div><div class="cmas">${orbi('ecstatic',96,'pop')}</div><div class="lvbig">${Ln.lv}</div><h4>Livello ${Ln.lv}!</h4><p>Ora sei <b style="color:var(--text)">${Ln.title}</b></p>${newAcc.length?`<div class="ctx">👕 Nuovo per Orbi: ${newAcc.map(a=>a.n).join(', ')}</div>`:''}<div class="tap">Tocca per continuare</div>`,
    fx:()=>{buzz([40,40,40,40,120]);sfx('level');confetti(180,true)}});}
  nm.forEach(id=>celQ.push(missionScreen(id)));
  nb.forEach(id=>celQ.push(badgeScreen(id)));
  showCel();

/* ---------- effetto elastico a inizio e fine pagina ---------- */
(()=>{
  const el=document.querySelector('.wrap');let y0=null,last=0,mode=null,on=false;
  const atTop=()=>window.scrollY<=0,atBot=()=>window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-1;
  const rub=d=>(1-1/(1+d/650))*.11;
  const set=(m,d)=>{if(!d){el.style.transform='';return}el.style.transformOrigin=m==='top'?'50% 0':'50% 100%';el.style.transform=`scaleY(${1+rub(d)})`};
  window.addEventListener('touchstart',e=>{if(e.touches.length>1||$('#sheet').classList.contains('on')||$('#cel').classList.contains('on')||e.target.closest('.wrapped,.today,.chips'))return;y0=last=e.touches[0].clientY;mode=null;on=true;el.style.transition='none'},{passive:true});
  window.addEventListener('touchmove',e=>{
    if(!on)return;const y=e.touches[0].clientY,step=y-last;last=y;
    if(!mode){if(step>0&&atTop()){mode='top';y0=y-step}else if(step<0&&atBot()){mode='bot';y0=y-step}else return}
    const dy=y-y0;
    if(mode==='top'){if(dy>0)set('top',dy);else{set();mode=null}}
    else{if(dy<0)set('bot',-dy);else{set();mode=null}}
  },{passive:true});
  const end=()=>{if(!on)return;on=false;el.style.transition='transform .5s cubic-bezier(.2,1.25,.35,1)';set();mode=null};
  window.addEventListener('touchend',end,{passive:true});window.addEventListener('touchcancel',end,{passive:true});
})();

/* ---------- anti-trucco: XP e traguardi seguono i voti veri ---------- */
['rimonta','sorpasso','gufo','alba','domenica','quarantadue'].forEach(id=>{const b=BADGES.find(x=>x.id===id);if(b)b.ev=1});
['dicasa','settegiorni','abitudine','centogiorni','architetto','contabile','stilista','previdente','influencer'].forEach(id=>{const b=BADGES.find(x=>x.id===id);if(b)b.perm=1});
function maxSuff(c){let best=0,cur=0;c.a.forEach(g=>{cur=g.v>=6?cur+1:0;if(cur>best)best=cur});return best}
[['fiamme',5],['cometa',10],['iper',20]].forEach(([id,n])=>{const b=BADGES.find(x=>x.id===id);if(b)b.p=c=>[maxSuff(c),n]});
function revoke(id){const b=BADGES.find(x=>x.id===id);S.badges=S.badges.filter(x=>x!==id);if(b)S.xp=Math.max(0,(S.xp||0)-RAR[b.r].xp);if(S.bdates)delete S.bdates[id];if(S.bsrc)delete S.bsrc[id]}
function revalidate(removedIds){
  S.bsrc=S.bsrc||{};
  (removedIds||[]).forEach(gid=>Object.keys(S.bsrc).forEach(bid=>{if(S.bsrc[bid]===gid){const b=BADGES.find(x=>x.id===bid);if(b&&b.ev&&S.badges.includes(bid))revoke(bid)}}));
  for(let k=0;k<5;k++){const c=bctx({});let ch=false;
    S.badges.slice().forEach(id=>{const b=BADGES.find(x=>x.id===id);if(!b||b.ev||b.perm)return;if(!bDone(b,c)){revoke(id);ch=true}});
    if(!ch)break}
  const act=activeMissions(),mc=misCtx();
  act.forEach(m=>{if(S.mis.done.includes(m.id)){const[x,mx]=m.f(mc);if(x<mx){S.mis.done=S.mis.done.filter(i=>i!==m.id);S.xp=Math.max(0,(S.xp||0)-m.xp)}}});
}
function snapProgress(){return JSON.stringify({xp:S.xp,badges:S.badges,bdates:S.bdates,bsrc:S.bsrc,mis:S.mis})}
function restoreProgress(j){Object.assign(S,JSON.parse(j))}
function deleteGrade(s,g){
  const snap=snapProgress(),idx=s.grades.indexOf(g);

  if($('#sheet').classList.contains('on'))openSubject(s.id);render();
  actionToast(`${esc(g.label)} eliminato`,'Annulla',()=>{s.grades.splice(idx,0,g);restoreProgress(snap);save();if($('#sheet').classList.contains('on'))openSubject(s.id);render()});
}
function removeSubject(s){

}

/* ===================== v10: tasto/gesto indietro di Android ===================== */
let skipPop=0;
const layerTop=()=>history.state&&history.state.layer;
function popLayerSilently(name){if(layerTop()===name){skipPop++;history.back()}}
function openSheet(html,keepScroll){
  const sh=$('#sheet'),top=sh.scrollTop,was=sh.classList.contains('on');
  $('#sheetIn').innerHTML='<div class="grab"></div>'+html;
  if(!was){sh.classList.add('on');$('#backdrop').classList.add('on');sh.scrollTop=0;if(layerTop()!=='sheet')history.pushState({layer:'sheet'},'')}
  else sh.scrollTop=keepScroll?top:0;
}
function realCloseSheet(){const sh=$('#sheet');sh.classList.remove('on');sh.style.transform='';$('#backdrop').classList.remove('on');render()}
function closeSheet(){exitOpen=false;realCloseSheet();popLayerSilently('sheet')}
function showCel(){
  const cel=$('#cel'),card=$('#celcard');clearTimeout(celT);
  const sc=celQ.shift();
  if(!sc){if(cel.classList.contains('on')){cel.classList.remove('on');popLayerSilently('cel')}return}
  if(!cel.classList.contains('on')&&layerTop()!=='cel')history.pushState({layer:'cel'},'');
  card.className='celcard '+(sc.cls||'');card.innerHTML=sc.html;void card.offsetWidth;card.classList.add('in');cel.classList.add('on');
  if(sc.fx)sc.fx(card);
}

/* schede: "indietro" riporta a Voti */
function goTab(t){
  if(t===tab)return;
  if(t==='voti'){if(layerTop()==='tab'){skipPop++;history.back()}}
  else if(tab==='voti'&&layerTop()!=='tab')history.pushState({layer:'tab'},'');
  tab=t;render();window.scrollTo({top:0});
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>goTab(b.dataset.tab));
function tabGo(d){const i=TABS.indexOf(tab)+d;if(i<0||i>=TABS.length)return;goTab(TABS[i])}
let exitOpen=false;
document.addEventListener('pointerdown',()=>{if(!history.state)try{history.pushState({layer:'root'},'')}catch(e){}},{capture:true,passive:true});
function askExit(){
  openSheet(`<div class="exitq">${orbi('sad',96)}<h3>Vuoi già uscire?</h3><p>Orbi ti aspetta qui per il prossimo voto.</p></div><div class="row"><button class="btn soft press" id="exGo">Esci</button><button class="btn press" id="exStay">Resta</button></div>`);
  exitOpen=true;
  $('#exStay').onclick=()=>{exitOpen=false;realCloseSheet();try{history.replaceState({layer:'root'},'')}catch(e){}};
  $('#exGo').onclick=()=>{exitOpen=false;realCloseSheet();skipPop+=2;history.go(-2)};
}
window.addEventListener('popstate',()=>{
  if(skipPop>0){skipPop--;return}
  if(exitOpen){exitOpen=false;realCloseSheet();skipPop++;history.back();return}
  if($('#cel').classList.contains('on')){celQ=[];$('#cel').classList.remove('on');return}
  const w=document.querySelector('.wrapped');if(w){w.classList.remove('on');setTimeout(()=>w.remove(),350);return}
  if($('#sheet').classList.contains('on')){realCloseSheet();return}
  if(tab!=='voti'){tab='voti';render();window.scrollTo({top:0});return}
  askExit();
});
