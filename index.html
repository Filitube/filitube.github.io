<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pagella</title>
<meta name="theme-color" content="#07080F" id="metaTheme">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3F8; --surface:#FFFFFF; --surface2:#F6F7FB; --text:#141826; --muted:#7A8099; --edge:#E6E8F0;
  --primary:#3D5AFE; --on-primary:#FFFFFF;
  --red:#F03E4F; --amber:#F59F00; --green:#12B886; --best:#3D5AFE;
  --shadow:0 1px 2px rgba(20,24,38,.04),0 6px 20px rgba(20,24,38,.06);
  --nav:rgba(255,255,255,.82);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0E16; --surface:#171A26; --surface2:#1F2332; --text:#F1F3FA; --muted:#8B91AB; --edge:#262A3A;
  --primary:#6E84FF; --on-primary:#0C0E16;
  --red:#FF6370; --amber:#FFB938; --green:#3DDBA4; --best:#8C9DFF;
  --shadow:0 1px 2px rgba(0,0,0,.3); --nav:rgba(23,26,38,.82);
}}
:root[data-theme="dark"]{
  --bg:#0C0E16; --surface:#171A26; --surface2:#1F2332; --text:#F1F3FA; --muted:#8B91AB; --edge:#262A3A;
  --primary:#6E84FF; --on-primary:#0C0E16;
  --red:#FF6370; --amber:#FFB938; --green:#3DDBA4; --best:#8C9DFF;
  --shadow:0 1px 2px rgba(0,0,0,.3); --nav:rgba(23,26,38,.82);
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.num,h1,h3{font-family:Sora,Inter,ui-sans-serif,system-ui,sans-serif}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:10px}
.press{transition:transform .12s ease}
.press:active{transform:scale(.97)}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 140px}

/* header */
.hello{color:var(--muted);font-size:15px;font-weight:500}
.titlebar{display:flex;align-items:center;justify-content:space-between}
h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:2px 0 0}
.round{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--muted);box-shadow:var(--shadow)}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.periods{margin-top:18px;background:var(--surface);box-shadow:var(--shadow)}
.periods button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);box-shadow:none}

/* overview */
.over{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--surface);border-radius:26px;padding:20px;margin-top:16px;box-shadow:var(--shadow)}
.ring{position:relative;width:128px;height:128px}
.ring svg{width:128px;height:128px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-family:Sora,sans-serif;font-size:36px;font-weight:700;letter-spacing:-.03em;line-height:1}
.ring .v span{font-size:12px;color:var(--muted);margin-top:4px}
.tiles{display:flex;flex-direction:column;gap:10px}
.tile{background:var(--surface2);border-radius:16px;padding:10px 14px}
.tile b{font-family:Sora,sans-serif;font-size:22px;font-weight:700;display:block;line-height:1.15}
.tile span{font-size:13px;color:var(--muted)}

.sechead{display:flex;align-items:baseline;justify-content:space-between;margin:28px 4px 12px}
.sechead h2{font-family:Sora,sans-serif;font-size:20px;font-weight:600;margin:0}
.sechead button{color:var(--primary);font-weight:600;font-size:15px}

/* subject rows */
.list{display:flex;flex-direction:column;gap:10px}
.subj{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border-radius:20px;padding:12px 14px 12px 12px;box-shadow:var(--shadow)}
.ico{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:24px}
.subj .n{font-weight:600;font-size:16px;line-height:1.2}
.lastg{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.mini{font-family:Sora,sans-serif;font-size:12px;font-weight:600;padding:2px 7px;border-radius:7px}
.none{font-size:13px;color:var(--muted)}
.avg{font-family:Sora,sans-serif;font-size:19px;font-weight:700;min-width:58px;text-align:center;padding:8px 10px;border-radius:14px}

.t-red{color:var(--red);background:color-mix(in srgb,var(--red) 13%,transparent)}
.t-amber{color:var(--amber);background:color-mix(in srgb,var(--amber) 15%,transparent)}
.t-green{color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}
.t-best{color:var(--best);background:color-mix(in srgb,var(--best) 13%,transparent)}
.t-none{color:var(--muted);background:var(--surface2)}
.c-red{color:var(--red)}.c-amber{color:var(--amber)}.c-green{color:var(--green)}.c-best{color:var(--best)}.c-none{color:var(--muted)}

.empty{background:var(--surface);border-radius:24px;padding:26px 20px;text-align:center;box-shadow:var(--shadow)}
.empty .em{font-size:40px}
.empty p{color:var(--muted);margin:6px 0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}

/* buttons/inputs */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--primary);color:var(--on-primary);border-radius:16px;padding:15px 18px;font-weight:700;font-size:16px}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.soft{background:var(--surface2);color:var(--text)}
.btn.danger{background:color-mix(in srgb,var(--red) 12%,transparent);color:var(--red)}
.field{width:100%;background:var(--surface2);border:2px solid transparent;border-radius:14px;padding:13px 14px;font-size:16px;outline:none}
.field:focus{border-color:var(--primary)}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:18px 2px 8px}
.row{display:flex;gap:10px;margin-top:20px}

/* goal cards */
.card{background:var(--surface);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.ctlrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.ctlrow + .ctlrow{border-top:1px solid var(--edge);padding-top:14px;margin-top:6px}
.ctlrow .l b{display:block;font-weight:600}
.ctlrow .l span{font-size:13px;color:var(--muted)}
.step{display:flex;align-items:center;background:var(--surface2);border-radius:14px}
.step button{width:42px;height:42px;font-size:22px;font-weight:500;color:var(--primary)}
.step output{min-width:44px;text-align:center;font-family:Sora,sans-serif;font-weight:700;font-size:19px}
.goal{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.goal .ico{width:44px;height:44px;font-size:21px;border-radius:13px}
.goal .n{font-weight:600}
.goal .d{font-size:13px;color:var(--muted);line-height:1.35;margin-top:2px}
.goal .need{text-align:center}
.goal .need b{display:block;font-family:Sora,sans-serif;font-size:24px;font-weight:700;padding:6px 10px;border-radius:13px;min-width:58px}
.goal .need span{font-size:11px;color:var(--muted);font-weight:600}
.track{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface2);position:relative;margin-top:4px}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.track .tg{position:absolute;top:-4px;width:3px;height:16px;border-radius:2px;background:var(--text);opacity:.5}

/* credits */
.hero-c{background:var(--primary);color:var(--on-primary);border-radius:26px;padding:22px;margin-top:16px}
.hero-c .k{font-size:14px;font-weight:600;opacity:.8}
.hero-c .big{font-family:Sora,sans-serif;font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1;margin:6px 0 2px}
.hero-c .s{font-size:14px;opacity:.85}
.hero-c .pill{display:inline-block;margin-top:14px;background:rgba(255,255,255,.18);padding:7px 12px;border-radius:12px;font-size:13px;font-weight:600}
.years{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.yr{background:var(--surface2);border-radius:16px;padding:12px;text-align:center}
.yr span{font-size:13px;color:var(--muted);font-weight:600}
.yr input{width:100%;border:0;background:none;text-align:center;font-family:Sora,sans-serif;font-size:28px;font-weight:700;outline:none;padding:2px 0}
.yr small{font-size:11px;color:var(--muted)}
.total{display:flex;align-items:baseline;justify-content:space-between;margin-top:18px}
.total b{font-family:Sora,sans-serif;font-size:30px;font-weight:700}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;border-radius:99px;background:var(--primary);transition:width .4s}
.note{font-size:13px;color:var(--muted);margin:12px 2px 0;line-height:1.45}

/* nav + fab */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100% - 96px));background:var(--nav);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:24px;box-shadow:0 8px 30px rgba(0,0,0,.14);display:flex;padding:6px;z-index:5;margin-left:-34px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:18px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent)}
.fab{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));right:max(16px,calc(50% - 264px));width:62px;height:62px;border-radius:22px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;box-shadow:0 10px 26px color-mix(in srgb,var(--primary) 45%,transparent);z-index:6}
.fab svg{width:28px;height:28px}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(8,10,20,.45);opacity:0;pointer-events:none;transition:opacity .22s;z-index:10}
.backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 20px calc(26px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1);z-index:11}
.sheet.on{transform:none}
.sheet .in{max-width:520px;margin:0 auto}
.grab{width:42px;height:5px;border-radius:9px;background:var(--edge);margin:0 auto 14px}
.shead{display:flex;align-items:center;gap:14px}
.shead .ico{width:56px;height:56px;font-size:28px;border-radius:18px}
.shead h3{margin:0;font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.shead .sub{font-size:14px;color:var(--muted)}
.shead .avg{margin-left:auto;font-size:24px}
.chart{margin-top:18px;background:var(--surface2);border-radius:20px;padding:12px 10px 6px}
.chart svg{width:100%;height:150px;display:block}
.gl{margin-top:6px}
.g{display:grid;grid-template-columns:52px 1fr 40px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--edge)}
.g:last-child{border-bottom:0}
.g .mini{font-size:18px;padding:7px 0;text-align:center;border-radius:12px}
.g .meta b{display:block;font-weight:600;font-size:15px}
.g .meta span{font-size:13px;color:var(--muted)}
.g button{width:40px;height:40px;border-radius:12px;color:var(--muted);display:grid;place-items:center}
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.keypad button{background:var(--surface2);border-radius:16px;padding:14px 0;font-family:Sora,sans-serif;font-size:22px;font-weight:600}
.keypad button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
.mods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.mods button{background:var(--surface2);border-radius:14px;padding:10px 0;font-weight:700;font-size:16px}
.mods button[aria-pressed="true"]{background:var(--text);color:var(--surface)}
.preview{display:flex;align-items:center;justify-content:space-between;margin-top:18px;background:var(--surface2);border-radius:18px;padding:12px 16px}
.preview .from{font-size:13px;color:var(--muted)}
.preview .arrow{font-family:Sora,sans-serif;font-size:20px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--surface);padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:30;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.view{animation:fade .22s ease}
.view.still{animation:none}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* messaggio + oggi */
.msg{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:20px;padding:14px 16px;margin-top:12px;box-shadow:var(--shadow)}
.msg .e{font-size:26px}
.msg b{display:block;font-weight:700;font-size:15px}
.msg span{font-size:13px;color:var(--muted)}
.today{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.today::-webkit-scrollbar{display:none}
.lez{flex:0 0 auto;border-radius:16px;padding:10px 12px;min-width:92px}
.lez small{display:block;font-size:11px;font-weight:700;opacity:.7}
.lez b{font-size:14px;font-weight:600;white-space:nowrap}
/* orario */
.ograd{display:grid;gap:5px;margin-top:16px}
.oh{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:6px 0;border-radius:10px}
.oh.now{background:var(--primary);color:var(--on-primary)}
.on{font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.on small{font-weight:500;font-size:9px;opacity:.8}
.oc{min-height:56px;border-radius:12px;padding:5px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden;font-size:10.5px;font-weight:600;line-height:1.15;text-align:center}
.oc .oe{font-size:17px}
.oc .ot{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc.empty{background:transparent;border:1.5px dashed var(--edge);color:var(--muted)}
.scan{display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px 8px 10px}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid var(--surface2);border-top-color:var(--primary);animation:sp 0.9s linear infinite;margin-bottom:16px}
@keyframes sp{to{transform:rotate(360deg)}}
.twobtn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.minibtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.minibtns button{background:var(--surface);box-shadow:var(--shadow);border-radius:12px;padding:9px 12px;font-size:14px;font-weight:600}
/* celebrazione */
.celebrate{position:fixed;inset:0;z-index:40;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .2s}
.celebrate.on{opacity:1;pointer-events:auto}
.celebrate::before{content:'';position:absolute;inset:0;background:rgba(8,10,20,.35)}
.celebrate canvas{position:absolute;inset:0;width:100%;height:100%}
.celcard{position:relative;background:var(--surface);border-radius:30px;padding:28px 26px 24px;width:min(320px,calc(100% - 48px));text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25);transform:scale(.6);opacity:0}
.celebrate.on .celcard{animation:pop .5s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes pop{to{transform:scale(1);opacity:1}}
.celcard .gv{display:inline-block;font-family:Sora,sans-serif;font-size:56px;font-weight:800;padding:6px 26px;border-radius:24px;line-height:1.1}
.celcard.low .gv{animation:wob 1.2s ease-in-out .4s}
@keyframes wob{25%{transform:rotate(-6deg)}50%{transform:rotate(5deg)}75%{transform:rotate(-2deg)}}
.celcard h4{font-family:Sora,sans-serif;font-size:24px;font-weight:700;margin:16px 0 4px}
.celcard p{margin:0;color:var(--muted);font-size:15px}
.celcard .ctx{margin-top:14px;background:var(--surface2);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:600}
.celcard .tap{margin-top:14px;font-size:12px;color:var(--muted)}
/* intro */
.intro{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .45s ease .05s}
.intro.out{opacity:0;pointer-events:none}
.intro .logo{width:112px;height:112px;border-radius:30px;background:#3D5AFE;display:grid;place-items:center;box-shadow:0 18px 50px rgba(61,90,254,.35);animation:lgin .5s cubic-bezier(.2,1.4,.4,1)}
.intro.out .logo{transform:scale(1.15);transition:transform .45s ease}
.intro svg{width:76px;height:76px;transform:rotate(-90deg)}
.intro .arc{stroke-dasharray:0 200;animation:arc .75s ease-out .1s forwards}
@keyframes arc{to{stroke-dasharray:118 200}}
@keyframes lgin{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
/* agenda */
.ver{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.ver .ico{width:44px;height:44px;font-size:21px;border-radius:13px}
.ver .n{font-weight:600}
.ver .d{font-size:13px;color:var(--muted);margin-top:1px}
.ver .need{font-size:12px;font-weight:700;margin-top:6px;display:inline-block;padding:3px 8px;border-radius:8px}
.cd{text-align:center;min-width:62px}
.cd b{display:block;font-family:Sora,sans-serif;font-size:24px;font-weight:700;line-height:1}
.cd span{font-size:11px;color:var(--muted);font-weight:600}
.cd.soon b{color:var(--red)}
.ask{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--primary) 12%,var(--surface));border-radius:20px;padding:14px;margin-top:10px}
.ask .t{flex:1;font-size:14px}
.ask .t b{display:block;font-size:15px}
.ask button{background:var(--primary);color:var(--on-primary);border-radius:12px;padding:9px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.ask button.x{background:none;color:var(--muted);padding:9px 4px}
/* statistiche */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sbox{background:var(--surface);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.sbox b{display:block;font-family:Sora,sans-serif;font-size:24px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbox span{font-size:13px;color:var(--muted)}
.dist{display:flex;align-items:flex-end;gap:5px;height:90px;margin-top:6px}
.dist div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.dist i{display:block;width:100%;border-radius:6px 6px 3px 3px;min-height:3px;transition:height .5s}
.dist small{font-size:11px;color:var(--muted);font-weight:600}
.badges{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.badges::-webkit-scrollbar{display:none}
.bdg{flex:0 0 auto;width:96px;background:var(--surface);border-radius:18px;padding:12px 8px;text-align:center;box-shadow:var(--shadow)}
.bdg .be{font-size:30px;line-height:1.2}
.bdg b{display:block;font-size:12px;font-weight:700;line-height:1.25;margin-top:4px}
.bdg.lock{opacity:.4}
.bdg.lock .be{filter:grayscale(1)}
/* pagella */
.pag{background:var(--surface);border-radius:24px;padding:6px 18px 14px;box-shadow:var(--shadow)}
.pr{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--edge)}
.pr:last-of-type{border-bottom:0}
.pr span{font-weight:500}
.pr b{font-family:Sora,sans-serif;font-size:17px;font-weight:700;min-width:40px;text-align:center;padding:4px 8px;border-radius:10px}
/* tema */
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 3px var(--surface)}
.sw[aria-pressed="true"]{border-color:var(--text)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ================= DESIGN LAYER: spazio ================= */
:root{
  --bg:#EEF0F8; --surface:rgba(255,255,255,.72); --surface2:rgba(20,24,50,.05); --text:#0E1124; --muted:#6B7190; --edge:rgba(20,24,50,.08);
  --hl:rgba(255,255,255,.9); --track:rgba(20,24,50,.08); --nav:rgba(255,255,255,.7); --sheetbg:rgba(250,251,255,.9);
  --shadow:0 1px 0 var(--hl) inset,0 10px 30px -12px rgba(30,40,90,.18);
  --red:#F0435A; --amber:#E89A00; --green:#0FB38A;
  --g1:#5B7CFF; --g2:#8B5CF6;
  --a1:rgba(91,124,255,.28); --a2:rgba(139,92,246,.22); --a3:rgba(6,182,212,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#07080F; --surface:rgba(255,255,255,.045); --surface2:rgba(255,255,255,.06); --text:#F4F5FF; --muted:#8E93B3; --edge:rgba(255,255,255,.07);
  --hl:rgba(255,255,255,.07); --track:rgba(255,255,255,.07); --nav:rgba(18,20,34,.62); --sheetbg:rgba(14,16,28,.9);
  --shadow:0 1px 0 var(--hl) inset,0 0 0 1px rgba(255,255,255,.05) inset;
  --red:#FF6378; --amber:#FFC145; --green:#3DDBA4;
  --a1:rgba(91,124,255,.32); --a2:rgba(139,92,246,.26); --a3:rgba(6,182,212,.18);
}}
:root[data-theme="dark"]{
  --bg:#07080F; --surface:rgba(255,255,255,.045); --surface2:rgba(255,255,255,.06); --text:#F4F5FF; --muted:#8E93B3; --edge:rgba(255,255,255,.07);
  --hl:rgba(255,255,255,.07); --track:rgba(255,255,255,.07); --nav:rgba(18,20,34,.62); --sheetbg:rgba(14,16,28,.9);
  --shadow:0 1px 0 var(--hl) inset,0 0 0 1px rgba(255,255,255,.05) inset;
  --red:#FF6378; --amber:#FFC145; --green:#3DDBA4;
  --a1:rgba(91,124,255,.32); --a2:rgba(139,92,246,.26); --a3:rgba(6,182,212,.18);
}
body{background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:-.005em}
body::before{content:'';position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 35% at 15% 8%,var(--a1),transparent 70%),radial-gradient(35% 30% at 95% 20%,var(--a2),transparent 70%),radial-gradient(45% 35% at 70% 95%,var(--a3),transparent 70%);
  filter:blur(20px);animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(-3%,2%,0) rotate(4deg)}}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background-image:radial-gradient(1px 1px at 12% 22%,rgba(255,255,255,.5),transparent 60%),radial-gradient(1px 1px at 68% 14%,rgba(255,255,255,.4),transparent 60%),radial-gradient(1.5px 1.5px at 82% 48%,rgba(255,255,255,.35),transparent 60%),radial-gradient(1px 1px at 30% 70%,rgba(255,255,255,.3),transparent 60%),radial-gradient(1px 1px at 55% 88%,rgba(255,255,255,.35),transparent 60%),radial-gradient(1px 1px at 92% 80%,rgba(255,255,255,.3),transparent 60%)}
:root[data-theme="light"] body::after{display:none}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) body::after{display:none}}
.wrap{padding-top:26px}
h1{font-family:Sora,Inter,sans-serif;font-size:32px;font-weight:700;letter-spacing:-.035em}
.hello{font-size:14px;letter-spacing:.02em}
.round{background:var(--surface);box-shadow:var(--shadow);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.seg{background:var(--surface2)}
.periods{background:var(--surface);box-shadow:var(--shadow);border-radius:16px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.periods button[aria-pressed="true"]{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 6px 18px -6px var(--g1)}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.1);color:var(--text);box-shadow:0 1px 0 var(--hl) inset}
:root[data-theme="light"] .seg button[aria-pressed="true"]{background:#fff}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .seg button[aria-pressed="true"]{background:#fff}}
.periods button[aria-pressed="true"]{background:linear-gradient(135deg,var(--g1),var(--g2))!important;color:#fff!important}

/* hero */
.over{position:relative;overflow:hidden;border-radius:30px;padding:22px;background:var(--surface);box-shadow:var(--shadow);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%)}
.over::before{content:'';position:absolute;width:220px;height:220px;left:-60px;top:-80px;border-radius:50%;background:radial-gradient(circle,var(--a1),transparent 70%);pointer-events:none}
.ring,.ring svg{width:136px;height:136px}
.ring .rgl{filter:drop-shadow(0 0 7px var(--gc));transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1)}
.ring .v b{font-family:Sora,sans-serif;font-size:38px;font-weight:700;letter-spacing:-.05em}
.ring .v span{text-transform:uppercase;letter-spacing:.14em;font-size:10px;font-weight:600}
.tile{background:var(--surface2);border-radius:18px;box-shadow:0 1px 0 var(--hl) inset}
.tile b{font-family:Sora,sans-serif;letter-spacing:-.03em}
.tile span{font-size:12px}

.sechead h2{font-family:Sora,sans-serif;font-size:19px;font-weight:600;letter-spacing:-.02em}
.sechead button{color:var(--text);opacity:.7}

/* cards */
.subj,.msg,.card,.goal,.sbox,.bdg,.pag,.empty,.ver{background:var(--surface);box-shadow:var(--shadow);border-radius:22px}
.subj{padding:12px 14px 12px 12px}
.ico{position:relative;border-radius:16px;box-shadow:0 1px 0 rgba(255,255,255,.12) inset}
.subj .n{font-weight:600;letter-spacing:-.01em}
.avg{font-family:Sora,sans-serif;border-radius:15px;letter-spacing:-.03em}
.mini{font-family:Sora,sans-serif}
.t-red{color:var(--red);background:color-mix(in srgb,var(--red) 15%,transparent);box-shadow:0 0 18px -6px var(--red)}
.t-amber{color:var(--amber);background:color-mix(in srgb,var(--amber) 15%,transparent);box-shadow:0 0 18px -6px var(--amber)}
.t-green{color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent);box-shadow:0 0 18px -6px var(--green)}
.mini.t-red,.mini.t-amber,.mini.t-green{box-shadow:none}
.t-none{background:var(--surface2)}
.msg{border-radius:22px}
.msg .e{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface2);font-size:22px;flex:0 0 auto}

/* bottoni */
.btn{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 10px 26px -10px var(--g1),0 1px 0 rgba(255,255,255,.25) inset;letter-spacing:-.01em}
.btn.soft{background:var(--surface2);color:var(--text);box-shadow:0 1px 0 var(--hl) inset}
.btn.danger{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red);box-shadow:none}
.chip{background:var(--surface2);box-shadow:0 1px 0 var(--hl) inset}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.keypad button,.mods button{background:var(--surface2);box-shadow:0 1px 0 var(--hl) inset;font-family:Sora,sans-serif}
.keypad button[aria-pressed="true"]{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 8px 20px -8px var(--g1)}
.mods button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.field{background:var(--surface2);border:1.5px solid transparent}
.field:focus{border-color:var(--g1)}
.step{background:var(--surface2)}
.step button{color:var(--text)}

/* nav + fab */
nav.tabs{background:var(--nav);backdrop-filter:blur(26px) saturate(160%);-webkit-backdrop-filter:blur(26px) saturate(160%);box-shadow:0 1px 0 var(--hl) inset,0 0 0 1px var(--edge) inset,0 20px 40px -12px rgba(0,0,0,.5);border-radius:26px}
nav.tabs button[aria-selected="true"]{background:var(--surface2);color:var(--text)}
nav.tabs button[aria-selected="true"] svg{stroke:url(#navg);color:var(--g1);filter:drop-shadow(0 0 6px var(--g1))}
.fab{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:24px;box-shadow:0 14px 34px -10px var(--g1),0 1px 0 rgba(255,255,255,.3) inset}

/* sheet */
.backdrop{background:rgba(3,4,10,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.sheet{background:var(--sheetbg);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);box-shadow:0 1px 0 var(--hl) inset,0 -20px 60px rgba(0,0,0,.35);border-radius:30px 30px 0 0}
.sheet h3,.shead h3{font-family:Sora,sans-serif;letter-spacing:-.03em}
.chart,.preview{background:var(--surface2)}

/* crediti */
.hero-c{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border-radius:30px;box-shadow:0 20px 50px -18px var(--g1)}
.hero-c::after{content:'';position:absolute;width:260px;height:260px;right:-90px;top:-110px;border-radius:50%;border:30px solid rgba(255,255,255,.08)}
.hero-c .big{font-family:Sora,sans-serif;letter-spacing:-.05em}
.yr{background:var(--surface2)}
.bar span{background:linear-gradient(90deg,var(--g1),var(--g2))}

/* orario */
.oh.now{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.oc.empty{border-color:var(--edge)}

/* celebrazione + toast */
.celcard{background:var(--sheetbg);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 1px 0 var(--hl) inset,0 30px 80px rgba(0,0,0,.45);border-radius:32px}
.celcard h4{font-family:Sora,sans-serif;letter-spacing:-.03em}
.celcard .gv{font-family:Sora,sans-serif}
.toast{background:var(--sheetbg);color:var(--text);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 1px 0 var(--hl) inset,0 10px 30px rgba(0,0,0,.3)}

/* intro */
.intro{background:#07080F}
.intro .logo{width:120px;height:120px;border-radius:30px;background:none;box-shadow:0 0 60px -6px rgba(91,124,255,.55);animation:lgin .55s cubic-bezier(.2,1.4,.4,1)}

/* entrata a cascata */
.view>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.view>*:nth-child(2){animation-delay:.04s}.view>*:nth-child(3){animation-delay:.08s}.view>*:nth-child(4){animation-delay:.12s}.view>*:nth-child(5){animation-delay:.16s}.view>*:nth-child(n+6){animation-delay:.2s}
.list>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.list>*:nth-child(2){animation-delay:.05s}.list>*:nth-child(3){animation-delay:.1s}.list>*:nth-child(4){animation-delay:.15s}.list>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.view{animation:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ================= v4: fix + duolingo vibes ================= */
body::before{filter:none}
nav.tabs button[aria-selected="true"] svg{filter:none}
.ring svg{overflow:visible}
.ring .ra{transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1)}
.over::before{display:none}
.over{background:radial-gradient(120% 90% at 0% 0%,color-mix(in srgb,var(--g1) 18%,transparent),transparent 60%),var(--surface)}

/* bottoni 3D */
.btn{box-shadow:0 5px 0 color-mix(in srgb,var(--g2) 55%,#000),0 12px 24px -10px var(--g1);transition:transform .08s,box-shadow .08s}
.btn.press:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--g2) 55%,#000)}
.btn.soft{box-shadow:0 4px 0 rgba(0,0,0,.35),0 1px 0 var(--hl) inset}
.btn.soft.press:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.danger{box-shadow:0 4px 0 color-mix(in srgb,var(--red) 30%,#000)}
.btn.danger.press:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--red) 30%,#000)}
.keypad button{box-shadow:0 4px 0 rgba(0,0,0,.35),0 1px 0 var(--hl) inset;transition:transform .08s,box-shadow .08s}
.keypad button.press:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.keypad button[aria-pressed="true"]{box-shadow:0 4px 0 color-mix(in srgb,var(--g2) 55%,#000)}
.mods button{box-shadow:0 3px 0 rgba(0,0,0,.35)}
.mods button.press:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.chip{box-shadow:0 3px 0 rgba(0,0,0,.3)}
.chip.press:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.fab{box-shadow:0 6px 0 color-mix(in srgb,var(--g2) 55%,#000),0 16px 34px -10px var(--g1)}
.fab.press:active{transform:translateY(5px);box-shadow:0 1px 0 color-mix(in srgb,var(--g2) 55%,#000)}
.subj.press:active{transform:scale(.98)}

/* livello */
.lvpill{margin-left:6px;font:inherit;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));padding:3px 9px;border-radius:999px;vertical-align:1px;box-shadow:0 2px 0 color-mix(in srgb,var(--g2) 55%,#000)}
.lvcard{display:flex;gap:14px;align-items:center;margin-top:16px;padding:18px;border-radius:26px;background:radial-gradient(120% 120% at 0% 0%,color-mix(in srgb,var(--g2) 30%,transparent),transparent 60%),var(--surface);box-shadow:var(--shadow)}
.lvi{flex:1;min-width:0}
.lvk{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.lvi b{display:block;font-family:Sora,sans-serif;font-size:22px;letter-spacing:-.03em;margin:2px 0 10px}
.lvs{display:block;font-size:12px;color:var(--muted);margin-top:8px}
.xpbar{height:12px;border-radius:99px;background:var(--surface2);overflow:hidden;box-shadow:inset 0 2px 3px rgba(0,0,0,.25)}
.xpbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFC145,#FF8A3D);position:relative;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.xpbar i::after{content:'';position:absolute;left:6px;right:6px;top:2px;height:3px;border-radius:9px;background:rgba(255,255,255,.45)}
.lvmini{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);box-shadow:var(--shadow);border-radius:20px;padding:12px 14px}
.lvmini>div{flex:1;min-width:0}
.lvmini b{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.lvn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:Sora,sans-serif;font-weight:800;font-size:20px;color:#fff;background:linear-gradient(135deg,#FFC145,#FF8A3D);box-shadow:0 3px 0 #B9621C}
.lvb{font-weight:700;font-size:14px}

/* traguardi */
.rhead{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin:18px 4px 10px}
.rhead small{margin-left:auto;color:var(--muted);font-weight:600}
.rdot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 10px currentColor}
.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btile{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);text-align:center}
.btile b{font-size:12px;font-weight:700;line-height:1.2}
.medal{position:relative;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.medal.on{background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--rc) 55%,#fff),var(--rc) 55%,color-mix(in srgb,var(--rc) 55%,#000));box-shadow:0 4px 0 color-mix(in srgb,var(--rc) 45%,#000),0 0 22px -4px var(--rc),inset 0 2px 0 rgba(255,255,255,.4)}
.medal.on span{filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.medal.off{background:var(--surface2);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--rc) 35%,transparent)}
.medal.off span{filter:grayscale(1) brightness(.6);opacity:.45}
.medal .lk{position:absolute;right:-2px;bottom:-2px;font-size:.36em;font-style:normal;background:var(--bg);border-radius:50%;width:1.7em;height:1.7em;display:grid;place-items:center}
.medal.on.r-leggendario::after{content:'';position:absolute;inset:0;border-radius:50%;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.65) 50%,transparent 65%);background-size:250% 100%;animation:shine 2.6s ease-in-out infinite}
@keyframes shine{from{background-position:130% 0}to{background-position:-130% 0}}
.bprog{width:70%;height:6px;border-radius:9px;background:var(--surface2);overflow:hidden}
.bprog i{display:block;height:100%;border-radius:9px;transition:width .9s}
.bprog.big{width:100%;height:10px;margin-top:16px}
.bdet{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 0 4px;overflow:hidden}
.bdet h3{margin:10px 0 4px;font-size:24px}
.bdet p{margin:0;color:var(--muted)}
.rpill{display:inline-block;margin-top:16px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--rc);background:color-mix(in srgb,var(--rc) 15%,transparent);padding:5px 10px;border-radius:999px}
.rays{position:absolute;left:50%;top:84px;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc) 40%,transparent) 0 10deg,transparent 10deg 24deg);-webkit-mask:radial-gradient(circle,#000 0,transparent 62%);mask:radial-gradient(circle,#000 0,transparent 62%);animation:spin 14s linear infinite;pointer-events:none;opacity:.8}
.bdet>*:not(.rays){position:relative}
@keyframes spin{to{transform:rotate(360deg)}}

/* mascotte */
.orbi{overflow:visible;flex:0 0 auto}
.orbi .ob-body{transform-box:view-box;transform-origin:50px 85px;animation:obbob 2.8s ease-in-out infinite}
.orbi .ob-eyes{transform-box:view-box;transform-origin:50px 50px;animation:blink 4.2s infinite}
.orbi .ob-ant{animation:antg 1.6s ease-in-out infinite}
.orbi.ob-ecstatic .ob-body{animation:objump .55s cubic-bezier(.3,0,.5,1) infinite alternate}
.orbi.ob-sad .ob-body{animation:obsad 3s ease-in-out infinite}
.orbi .ob-tear{animation:tear 1.8s ease-in infinite}
@keyframes obbob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-3deg)}}
@keyframes objump{from{transform:translateY(2px) scale(1.04,.96)}to{transform:translateY(-9px) scale(.97,1.03)}}
@keyframes obsad{0%,100%{transform:translateY(2px) rotate(2deg)}50%{transform:translateY(4px) rotate(-2deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes antg{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes tear{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(14px);opacity:0}}
.orbi.pop{animation:popin .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes popin{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.msg{gap:10px;padding:10px 16px 10px 8px}
.msg .orbi{margin:-6px 0}

/* celebrazioni */
.celebrate.on .celcard{animation:none}
.celcard{overflow:hidden;opacity:0;transform:scale(.6);width:min(330px,calc(100vw - 40px))}
.celebrate.on .celcard.in{animation:pop .5s cubic-bezier(.2,1.5,.4,1) forwards}
.celcard>*:not(.rays){position:relative}
.celcard .rays{top:110px}
.cmas{display:flex;justify-content:center;margin:-8px 0 6px}
.celcard .gv{font-size:46px;padding:4px 22px}
.xprow{display:flex;align-items:center;gap:10px;margin-top:16px}
.xpchip{font-family:Sora,sans-serif;font-weight:800;font-size:15px;color:#FFC145;white-space:nowrap}
.xprow .xpbar{flex:1;height:12px}
.xplv{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}

/* ================= INTRO ================= */
.intro{background:#07080F;overflow:hidden;transition:opacity .6s ease}
.intro.out{opacity:0}
.intro.out .scene{transform:scale(1.18);transition:transform .7s cubic-bezier(.5,0,.75,0)}
.intro .warp{position:absolute;inset:0}
.intro .warp i{position:absolute;left:50%;top:50%;width:2px;height:calc(40px*var(--s));margin-left:-1px;border-radius:2px;background:linear-gradient(to top,rgba(255,255,255,0),#fff);transform-origin:50% 0;opacity:0;animation:warp 1.1s cubic-bezier(.5,0,.9,.4) var(--dl) both}
@keyframes warp{0%{transform:rotate(var(--a)) translateY(10px) scaleY(.1);opacity:0}25%{opacity:.9}100%{transform:rotate(var(--a)) translateY(75vmax) scaleY(2.4);opacity:0}}
.intro .scene{position:relative;display:flex;flex-direction:column;align-items:center}
.intro .orb{width:180px;height:180px;overflow:visible;transform:none}
.intro .iicon{position:absolute;top:22px;left:50%;width:136px;height:136px;margin-left:-68px;border-radius:32px;animation:iicon .5s ease-in forwards}
@keyframes iicon{to{transform:scale(.6);opacity:0}}
.intro .itrack{opacity:0;animation:fadein .4s ease .15s forwards}

.intro .iplanet{opacity:0}
@keyframes orbit{from{transform:rotate(0);opacity:1}to{transform:rotate(285deg);opacity:1}}
.intro .ispark{transform-box:view-box;transform-origin:80px 80px;transform:scale(0);animation:spark .6s cubic-bezier(.2,1.6,.4,1) 1.15s forwards}
@keyframes spark{0%{transform:scale(0) rotate(-90deg)}100%{transform:scale(1) rotate(0)}}
@keyframes fadein{to{opacity:1}}
.intro .iword{display:flex;margin-top:22px;font-family:Sora,sans-serif;font-size:40px;font-weight:800;letter-spacing:-.04em;color:#fff}
.intro .iword span{display:inline-block;opacity:0;transform:translateY(24px);animation:letter .55s cubic-bezier(.2,1.4,.4,1) calc(1.3s + var(--i)*.05s) forwards}
@keyframes letter{to{opacity:1;transform:none}}
.intro .itag{margin-top:6px;font-size:14px;letter-spacing:.08em;color:#8E93B3;opacity:0;animation:fadein .5s ease 1.8s forwards}
.intro .quick .ispark{animation-delay:.55s}
.intro .quick .iicon{animation-duration:.3s}
.intro .quick .itrack{animation-delay:0s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ================= v6 ================= */
.sheet.on{display:block;font-size:16px;font-weight:400;color:var(--text);line-height:1.45;text-align:left}
.medal.on{display:grid}
:root{--sheetsolid:#FAFBFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sheetsolid:#0E1020}}
:root[data-theme="dark"]{--sheetsolid:#0E1020}
/* animazioni solo all'entrata */
.view>*,.list>*{animation:none}
.view.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.view.enter>*:nth-child(2){animation-delay:.04s}.view.enter>*:nth-child(3){animation-delay:.08s}.view.enter>*:nth-child(4){animation-delay:.12s}.view.enter>*:nth-child(5){animation-delay:.16s}.view.enter>*:nth-child(n+6){animation-delay:.2s}
.view.enter .list>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.view.enter .list>*:nth-child(2){animation-delay:.05s}.view.enter .list>*:nth-child(3){animation-delay:.1s}.view.enter .list>*:nth-child(4){animation-delay:.15s}.view.enter .list>*:nth-child(n+5){animation-delay:.2s}
/* barra in basso + pulsante allineati */
nav.tabs{left:max(14px,calc(50% - 266px));right:calc(max(14px,calc(50% - 266px)) + 78px);width:auto;transform:none;margin:0;height:64px;bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:6px;align-items:stretch}

/* che voto mi serve */
.gcard{border-radius:24px;padding:18px;background:radial-gradient(120% 120% at 100% 0%,color-mix(in srgb,var(--g1) 22%,transparent),transparent 60%),var(--surface);box-shadow:var(--shadow)}

.nh{display:flex;align-items:center;gap:12px}
.nh .ico{width:44px;height:44px;font-size:21px;border-radius:13px}
.nn{flex:1;min-width:0}

.nn span{font-size:13px;color:var(--muted)}
.ncard .need{text-align:center}

/* orario */
.otbl{display:grid;gap:5px;margin-top:16px;position:relative}

.ocol{border-radius:14px;background:color-mix(in srgb,var(--g1) 9%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--g1) 30%,transparent);margin:-3px}
.oblk{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;padding:4px 3px;overflow:hidden;font-size:10.5px;font-weight:700;line-height:1.15;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 3px 0 rgba(0,0,0,.28)}
.oblk .oe{font-size:18px}

.oblk.empty{background:transparent;box-shadow:inset 0 0 0 1.5px var(--edge);color:var(--muted);font-size:16px}
.oblk.live{box-shadow:0 0 0 2px var(--g1),0 0 18px -2px var(--g1),0 3px 0 rgba(0,0,0,.28)}
.olive{position:absolute;top:4px;right:4px;font-style:normal;font-size:8.5px;font-weight:800;text-transform:uppercase;background:var(--g1);color:#fff;border-radius:6px;padding:1px 4px;animation:antg 1.6s ease-in-out infinite}
.minibtns button{box-shadow:0 3px 0 rgba(0,0,0,.3),var(--shadow);background:var(--surface)}
.minibtns button.press:active{transform:translateY(2px)}
/* comportamento da app */
html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior-y:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
img,svg{-webkit-user-drag:none;user-drag:none}
/* ================= v7 ================= */
body::before{translate:calc(var(--px,0px) * -.6) calc(var(--py,0px) * -.6);transition:translate .4s ease-out}
body::after{translate:var(--px,0px) var(--py,0px);transition:translate .4s ease-out;
  background-image:radial-gradient(1px 1px at 12% 22%,rgba(255,255,255,.55),transparent 60%),radial-gradient(1px 1px at 68% 14%,rgba(255,255,255,.45),transparent 60%),radial-gradient(1.5px 1.5px at 82% 48%,rgba(255,255,255,.4),transparent 60%),radial-gradient(1px 1px at 30% 70%,rgba(255,255,255,.35),transparent 60%),radial-gradient(1px 1px at 55% 88%,rgba(255,255,255,.4),transparent 60%),radial-gradient(1px 1px at 92% 80%,rgba(255,255,255,.35),transparent 60%),radial-gradient(1px 1px at 6% 52%,rgba(255,255,255,.4),transparent 60%),radial-gradient(1.5px 1.5px at 40% 8%,rgba(255,255,255,.45),transparent 60%),radial-gradient(1px 1px at 75% 64%,rgba(255,255,255,.3),transparent 60%),radial-gradient(1px 1px at 22% 92%,rgba(255,255,255,.35),transparent 60%),radial-gradient(1px 1px at 50% 40%,rgba(255,255,255,.25),transparent 60%),radial-gradient(1.5px 1.5px at 96% 6%,rgba(255,255,255,.4),transparent 60%)}
/* transizioni di scheda */
.view.enter.from-r{animation:fromR .38s cubic-bezier(.2,.8,.2,1) both}
.view.enter.from-l{animation:fromL .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes fromR{from{transform:translateX(34px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fromL{from{transform:translateX(-34px);opacity:.3}to{transform:none;opacity:1}}
/* header */
.flpill{margin-left:6px;font:inherit;font-size:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,#FF8A3D,#F03E4F);padding:3px 9px;border-radius:999px;vertical-align:1px;box-shadow:0 2px 0 #9C2A1E}
.stk{text-align:center;padding:10px 0 4px}
.flame{display:inline-block;animation:flick 1.2s ease-in-out infinite alternate;transform-origin:50% 90%}
.flame.big{font-size:80px;line-height:1}
@keyframes flick{0%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.07,1.1) rotate(2deg)}100%{transform:scale(.97,1.04) rotate(-1deg)}}
.stk b{display:block;font-family:Sora,sans-serif;font-size:34px;letter-spacing:-.03em;margin-top:6px}
.stk p{margin:2px 0 0;color:var(--muted)}
.week{display:flex;justify-content:space-between;gap:6px;margin-top:18px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.wd i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-style:normal;font-size:18px}

/* toast con azione */
.toast.act{display:flex;align-items:center;gap:14px;pointer-events:auto;padding:8px 8px 8px 16px;white-space:nowrap}

.g .meta{cursor:pointer}

.wbtn{margin-top:12px;font:inherit;font-size:13px;font-weight:700;color:var(--text);background:var(--surface2);border-radius:12px;padding:8px 12px;box-shadow:0 3px 0 rgba(0,0,0,.3)}

.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.atile b{font-size:12px}

.atile.on2{box-shadow:0 0 0 2px var(--g1),0 0 16px -4px var(--g1)}

.mlist{display:flex;flex-direction:column;gap:8px}

.avg{position:relative}
.tr{position:absolute;top:-6px;right:-6px;font-style:normal;font-size:9px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff}
.tr.up{background:var(--green)}

.wcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-top:16px;padding:16px;border-radius:24px;color:#fff;background:linear-gradient(120deg,#DB2777,#7C4DFF 55%,#06B6D4);box-shadow:0 6px 0 #4A1D8F,0 18px 40px -16px #7C4DFF}

.wcard div span{font-size:13px;opacity:.85}
.wci{font-size:30px}
.wca{margin-left:auto;font-size:28px;opacity:.8}
.wrapped{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 80% at 20% 10%,var(--w1),var(--w2));color:#fff;opacity:0;transition:opacity .3s,background .5s;padding-top:env(safe-area-inset-top,0px)}

.wbars{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;display:flex;gap:4px}

.wbars i.cur b{animation:wbar 5.2s linear forwards}

.wx{position:absolute;top:calc(26px + env(safe-area-inset-top,0px));right:12px;width:40px;height:40px;border-radius:50%;color:#fff;font-size:18px;background:rgba(255,255,255,.15);z-index:2}

.wcont{text-align:center;max-width:340px;animation:wIn .55s cubic-bezier(.2,1.3,.4,1) both}

.wo{display:flex;justify-content:center;margin-bottom:10px}
.wcont .btn{margin-top:22px}

.wrap{will-change:auto}
/* ================= v8: pulsanti 3D più "schiacciosi" ================= */
.btn,.keypad button,.mods button,.chip,.fab,.minibtns button,.step button,.wbtn,.tbtn,.lvpill,.flpill{transition:transform .38s cubic-bezier(.3,2,.45,1),box-shadow .3s cubic-bezier(.3,2,.45,1),filter .2s}
.btn{box-shadow:0 6px 0 color-mix(in srgb,var(--g2) 50%,#000),0 14px 26px -12px var(--g1)}

.keypad button.press:active{transform:translateY(5px) scale(.93,.88);box-shadow:0 0 0 rgba(0,0,0,.42);filter:brightness(1.25);transition-duration:.05s}

.keypad button[aria-pressed="true"].press:active{box-shadow:0 0 0 #000}
.mods button{box-shadow:0 4px 0 rgba(0,0,0,.4)}

.chip{box-shadow:0 4px 0 rgba(0,0,0,.35)}
.chip.press:active{transform:translateY(4px) scale(.95,.9);box-shadow:0 0 0 #000;transition-duration:.05s}

.minibtns button.press:active{transform:translateY(3px) scale(.95,.9);transition-duration:.05s}

/* la pressione la gestisce lo script: niente salti a scatti del CSS */
.btn,.keypad button,.mods button,.chip,.fab,.minibtns button,.step button,.wbtn,.subj,.btile,.atile,.oblk,.lvmini,.wcard{transition:box-shadow .12s ease,filter .12s ease,background .15s,color .15s!important}
.btn.press:active,.btn.soft.press:active,.btn.danger.press:active,.fab.press:active,.keypad button.press:active,.mods button.press:active,.chip.press:active,.step button:active,.minibtns button.press:active,.subj.press:active,.press:active{transform:none}
.fab.press:active svg{transform:none}
.btn.isdown{box-shadow:0 0 0 #000,0 4px 10px -8px var(--g1)!important;filter:brightness(1.1)}
.btn.soft.isdown,.btn.danger.isdown{box-shadow:0 0 0 #000!important}
.fab.isdown{box-shadow:0 0 0 #000,0 6px 14px -8px var(--g1)!important;filter:brightness(1.12)}
.keypad button.isdown,.mods button.isdown,.chip.isdown{box-shadow:0 0 0 #000!important;filter:brightness(1.2)}
.fab svg{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.fab.isdown svg{transform:rotate(45deg)}

/* spaziature coerenti */
.wrap{padding:22px 18px 150px}
.titlebar{align-items:flex-start}
.periods{margin-top:20px}
.over{margin-top:18px;padding:20px;gap:20px}
.msg{margin-top:12px;padding:12px 16px 12px 10px;gap:12px;align-items:center}
.msg b{margin-bottom:2px}
.sechead{margin:32px 4px 14px}
.list{gap:12px}
.subj{padding:14px 16px 14px 14px;gap:14px}
.sgrid{gap:12px}
.sbox{padding:16px}
.ncard,.goal,.mis{padding:16px}
.mlist{gap:10px}
.bgrid{gap:12px}
.btile{padding:16px 6px 14px}
.rhead{margin:22px 4px 12px}
.card{padding:18px}
.sheet{padding:10px 20px calc(30px + env(safe-area-inset-bottom,0px))}
.lbl{margin:22px 2px 10px}
.row{margin-top:22px}
.row+.row{margin-top:12px}
.keypad{gap:10px}
.mods{gap:10px;margin-top:10px}
.preview{margin-top:22px}
.note{margin:14px 4px 0}
.today{gap:10px}
.minibtns{gap:10px;margin-top:18px}
.empty{padding:28px 20px}

/* card livello centrata */
.lvc{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:18px;padding:22px 20px 20px;border-radius:28px;background:radial-gradient(90% 70% at 50% 0%,color-mix(in srgb,var(--g2) 26%,transparent),transparent 70%),var(--surface);box-shadow:var(--shadow)}
.lvo{margin:-4px 0 6px}
.lvc .lvk{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lvt{display:block;font-family:Sora,sans-serif;font-size:26px;letter-spacing:-.03em;margin:4px 0 16px}
.lvc .xpbar{width:100%}
.lvr{display:flex;justify-content:space-between;width:100%;margin-top:10px;font-size:13px;color:var(--muted);font-weight:600}
.lvc .btn{margin-top:18px}
/* celebrazioni: raggi centrati sul protagonista */
.celcard{padding:30px 24px 22px}
.celcard .cmas{margin:0 0 8px}
.celcard.lvup .rays,.celcard.mis-c .rays{top:82px}
.celcard.bunl .rays{top:86px}
.celcard .rays{top:82px}
.celcard .lvbig{margin-top:2px}
.celcard h4{margin:14px 0 6px}
.celcard .ctx{margin-top:16px}
.celcard .tap{margin-top:16px}
/* armadio */
.wprev{margin:10px 0 2px}
.agrid{gap:10px}
.atile{padding:12px 4px}
.ob-moons{animation:obbob 4s ease-in-out infinite;transform-box:view-box;transform-origin:50px 50px}
/* indicatore scheda animato */
nav.tabs{position:fixed}
.tabind{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:18px;background:var(--surface2);box-shadow:0 1px 0 var(--hl) inset;transition:transform .42s cubic-bezier(.3,1.25,.5,1),width .42s cubic-bezier(.3,1.25,.5,1);pointer-events:none;z-index:0}
nav.tabs button{position:relative;z-index:1;transition:color .25s}
nav.tabs button[aria-selected="true"]{background:transparent!important}
nav.tabs button svg{transition:transform .35s cubic-bezier(.3,1.6,.5,1),color .25s}
nav.tabs button[aria-selected="true"] svg{transform:translateY(-1px) scale(1.08)}
.exitq{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0 0}
.exitq h3{position:static!important;margin:10px 0 4px!important;padding:0!important;background:none!important;font-size:24px}
.exitq p{margin:0;color:var(--muted)}
</style>
</head>
<body>
<div class="intro" id="intro" aria-hidden="true"><img class="logo" src="icon-512.png" alt=""></div>
<div class="wrap">
  <div class="titlebar">
    <div><div class="hello" id="hello">Ciao Filippo<button class="lvpill press" id="lvpill" data-goto="obiettivi"></button><button class="flpill press" id="flpill"></button></div><h1 id="ttl">I tuoi voti</h1></div>
    <button class="round press" id="settingsBtn" aria-label="Impostazioni"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
  </div>
  <div class="seg periods" id="periods" role="group" aria-label="Periodo">
    <button data-p="1">1° periodo</button><button data-p="2">2° periodo</button><button data-p="all">Anno</button>
  </div>
  <main id="view"></main>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="navg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--g1)"/><stop offset="1" style="stop-color:var(--g2)"/></linearGradient></defs></svg>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="voti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Voti</button>
  <button role="tab" data-tab="obiettivi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>Obiettivi</button>
  <button role="tab" data-tab="crediti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.9z"/></svg>Crediti</button>
  <button role="tab" data-tab="orario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 3v3M16 3v3M8 14h2M14 14h2M8 17h2"/></svg>Orario</button>
</nav>
<input type="file" id="camIn" accept="image/*" capture="environment" hidden>
<input type="file" id="galIn" accept="image/*" hidden>
<div class="celebrate" id="cel" aria-live="polite"><canvas id="confetti"></canvas><div class="celcard" id="celcard"></div></div>
<button class="fab press" id="fab" aria-label="Aggiungi voto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ===== dati ===== */
const KEY='pagella-v1';
const HAS_AI=!!(window.claude&&window.claude.use);
const PALETTE=['#3D5AFE','#FF6B3D','#12B886','#F59F00','#E64980','#7950F2','#1098AD','#82C91E','#FA5252','#4C6EF5'];
const SUGGEST=['Italiano','Latino','Greco','Matematica','Fisica','Inglese','Storia','Filosofia','Scienze','Storia dell\'arte','Scienze motorie','Informatica','Religione','Ed. civica'];
const EMOJI=[['ital','📖'],['latin','🏛️'],['grec','🏺'],['mate','📐'],['fisic','⚛️'],['ingl','🇬🇧'],['spagn','🇪🇸'],['franc','🇫🇷'],['tedes','🇩🇪'],['stori','📜'],['filos','💭'],['scien','🧬'],['chim','🧪'],['bio','🧬'],['arte','🎨'],['disegn','✏️'],['motor','🏃'],['inform','💻'],['relig','🕊️'],['civic','⚖️'],['music','🎵'],['diritt','⚖️'],['econ','📊'],['geo','🌍']];
const defaults=()=>({subjects:[],condotta:{1:8,2:8},crediti:{3:null,4:null,5:null},anno:3,cutoff:'01-31',k:2,target:6,inclCondotta:true,orario:null,verifiche:[],badges:[],theme:{mode:'auto',accent:'blu'},updatedAt:0});
let S=defaults();
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(defaults(),JSON.parse(raw));}catch(e){}
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
let period=periodOf(today()), tab='voti', agendaMode='verifiche';
const picked=new Set();

/* ===== salvataggio ===== */
let remoteRef=null,saveTimer=null;
function save(){
  S.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{if(!remoteRef)return;try{await remoteRef.set({json:JSON.stringify(S),updatedAt:S.updatedAt});}catch(e){}},600);
}
(async()=>{try{
  if(!window.claude||!window.claude.use)return;
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user)return;
  const id=await user.id();if(!id)return;
  remoteRef=db.doc('data/users/'+id+'/state');
  const snap=await remoteRef.get();
  const d=snap.exists?snap.data():null;
  if(d&&d.json&&(d.updatedAt||0)>(S.updatedAt||0)){S=Object.assign(defaults(),JSON.parse(d.json));try{localStorage.setItem(KEY,d.json)}catch(e){}render();}
  else if(S.updatedAt)save();
}catch(e){}})();

/* ===== calcoli ===== */
function periodOf(dateStr){
  const [m,d]=S.cutoff.split('-').map(Number);
  const dt=new Date(dateStr+'T12:00:00');
  const y=dt.getMonth()>=8?dt.getFullYear()+1:dt.getFullYear();
  return dt<=new Date(y,m-1,d,23,59)?1:2;
}
const inPeriod=g=>period==='all'||periodOf(g.date)===period;
const gradesOf=s=>s.grades.filter(inPeriod).sort((a,b)=>a.date.localeCompare(b.date));
function avg(gs){let w=0,v=0;gs.forEach(g=>{w+=g.w;v+=g.v*g.w});return w?v/w:null}
const subjAvg=s=>avg(gradesOf(s));
function tone(v){if(v==null)return'none';if(v<5)return'red';if(v<6)return'amber';return'green'}
const fmt=v=>v==null?'–':(Math.round(v*100)/100).toLocaleString('it-IT',{maximumFractionDigits:2});
const fmtQ=v=>fmt(Math.ceil(v*4-1e-9)/4);
function generale(){const a=S.subjects.map(subjAvg).filter(v=>v!=null);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
const perForCredit=()=>period==='all'?2:period;
function mediaScrutinio(){
  const a=S.subjects.map(subjAvg).filter(v=>v!=null).map(v=>Math.floor(v+.5));
  if(!a.length)return null;
  if(S.inclCondotta)a.push(S.condotta[perForCredit()]);
  return a.reduce((x,y)=>x+y,0)/a.length;
}
function band(M,anno){
  if(M==null)return null;
  const T={6:[[7,8],[8,9],[9,10]],7:[[8,9],[9,10],[10,11]],8:[[9,10],[10,11],[11,12]],9:[[10,11],[11,12],[13,14]],10:[[11,12],[12,13],[14,15]]},i=anno-3;
  if(M<6-1e-9)return anno===5?[7,8]:null;
  if(Math.abs(M-6)<1e-9)return T[6][i];
  return M<=7?T[7][i]:M<=8?T[8][i]:M<=9?T[9][i]:T[10][i];
}
function needed(s,target,k){let w=0,v=0;gradesOf(s).forEach(g=>{w+=g.w;v+=g.v*g.w});return(target*(w+k*100)-v)/(k*100)}
const gradeVal=(n,m)=>Math.max(1,Math.min(10,n+{'':0,'+':.25,'-':-.25,'½':.5}[m]));
function colorOf(s){if(!s.color){s.color=PALETTE[S.subjects.indexOf(s)%PALETTE.length]}return s.color}
function emojiOf(name){const n=name.toLowerCase();for(const[k,e]of EMOJI)if(n.includes(k))return e;return'📘'}
const icoStyle=s=>`background:color-mix(in srgb,${colorOf(s)} 16%,transparent)`;

/* ===== util ===== */
const $=q=>document.querySelector(q);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tt;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('on'),1900)}
const dateIt=d=>new Date(d+'T12:00').toLocaleDateString('it-IT',{day:'numeric',month:'short'});

/* ===== viste ===== */
function render(){
  document.querySelectorAll('#periods button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.p===String(period))));
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));moveInd();
  $('#ttl').textContent={voti:'I tuoi voti',obiettivi:'Obiettivi',crediti:'Crediti',orario:'Orario'}[tab];
  $('#periods').style.display=tab==='orario'?'none':'';
  const v=$('#view');
  v.innerHTML=`<div class="view">${tab==='voti'?viewVoti():tab==='obiettivi'?viewObiettivi():tab==='crediti'?viewCrediti():viewOrario()}</div>`;
  bind(v);afterRender(v);
}
const GR={red:['#FF5F6D','#FF9A8B'],amber:['#FFB938','#FFE066'],green:['#3DDBA4','#4CC9F0'],none:['#3A3F55','#3A3F55'],best:['#3DDBA4','#4CC9F0']};
function ringOld(val){
  const C=2*Math.PI*54,p=val==null?0:Math.max(0,Math.min(1,val/10)),t=tone(val);
  return `<div class="ring"><svg viewBox="0 0 128 128"><circle cx="64" cy="64" r="54" fill="none" stroke="var(--surface2)" stroke-width="12"/><circle cx="64" cy="64" r="54" fill="none" stroke="var(--${t==='none'?'edge':t})" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*p} ${C}"/></svg><div class="v"><b>${fmt(val)}</b><span>media</span></div></div>`;
}
function viewVoti(){
  const g=generale(),b=band(mediaScrutinio(),S.anno);
  const insuff=S.subjects.filter(s=>{const a=subjAvg(s);return a!=null&&a<6}).length;
  const count=S.subjects.reduce((t,s)=>t+gradesOf(s).length,0);
  let h=`<section class="over">${ring(g)}<div class="tiles">
    <div class="tile"><b class="${insuff?'c-red':''}">${insuff}</b><span>${insuff===1?'insufficienza':'insufficienze'}</span></div>
    <div class="tile"><b>${b?b[0]+'–'+b[1]:'–'}</b><span>credito stimato</span></div>
  </div></section>`;
  h+=dailyMsgV7()+todayCard();
  h+=`<div class="sechead"><h2>Materie</h2>${S.subjects.length?`<button id="addSubjBtn">+ Materia</button>`:''}</div>`;
  if(!S.subjects.length){
    h+=`<div class="empty"><div class="em">📚</div><p>Scegli le tue materie per iniziare</p><div class="chips">${SUGGEST.map(n=>`<button class="chip press" data-quick="${esc(n)}" aria-pressed="${picked.has(n)}">${emojiOf(n)} ${esc(n)}</button>`).join('')}</div>
    <div class="row"><button class="btn press" id="pickOk" ${picked.size?'':'disabled'}>${picked.size?'Aggiungi '+picked.size+(picked.size===1?' materia':' materie'):'Seleziona le materie'}</button></div>
    <button class="note" id="addSubjBtn" style="margin-top:14px;color:var(--primary);font-weight:600">Non c'è la tua? Scrivila tu</button></div>`;
    return h;
  }
  h+='<div class="list">'+S.subjects.map(s=>{
    const gs=gradesOf(s),a=avg(gs),last=gs.slice(-5);
    return `<button class="subj press" data-open="${s.id}"><div class="ico" style="${icoStyle(s)}">${emojiOf(s.name)}</div>
    <div><div class="n">${esc(s.name)}</div>${last.length?`<div class="lastg">${last.map(x=>`<span class="mini t-${tone(x.v)} ${x.nm?'nmg':''}">${esc(x.label)}</span>`).join('')}</div>`:`<div class="none">Nessun voto</div>`}</div>
    <div class="avg t-${tone(a)}">${fmt(a)}</div></button>`}).join('')+'</div>';
  if(!count)h+=`<p class="note" style="text-align:center;margin-top:16px">Tocca + in basso per inserire il primo voto</p>`;
  else h+=statsBlock();
  return h;
}
function stepper(id,title,sub,val){return `<div class="ctlrow"><div class="l"><b>${title}</b>${sub?`<span>${sub}</span>`:''}</div><div class="step"><button data-step="${id}" data-d="-1" aria-label="Diminuisci">−</button><output>${val}</output><button data-step="${id}" data-d="1" aria-label="Aumenta">+</button></div></div>`}
function viewObiettiviOld(){
  let h=`<div class="card" style="margin-top:16px">${stepper('target','Media obiettivo','in ogni materia',fmt(S.target))}${stepper('k','Verifiche rimaste','per materia, a peso pieno',S.k)}</div>`;
  const rows=S.subjects.filter(s=>gradesOf(s).length).map(s=>({s,a:subjAvg(s),x:needed(s,S.target,S.k)})).sort((p,q)=>q.x-p.x);
  if(!rows.length)return h+`<div class="empty" style="margin-top:16px"><div class="em">🎯</div><p>Inserisci qualche voto e qui vedrai quanto ti serve in ogni materia</p></div>`;
  const under=rows.filter(r=>r.a<S.target),over=rows.filter(r=>r.a>=S.target);
  const card=({s,a,x})=>{
    let need,lab,d,t;
    if(x>10){need='✕';lab='impossibile';t='red';d=`Con ${S.k} ${S.k===1?'verifica':'verifiche'} non basta neanche il 10`}
    else if(x<=1){need='✓';lab='al sicuro';t='green';d=`Resti sopra ${fmt(S.target)} qualunque voto prendi`}
    else if(a<S.target){need=fmtQ(x);lab='ti serve';t=x<=6.5?'green':x<=8?'amber':'red';d=`Ora hai ${fmt(a)}, serve in ${S.k===1?'la prossima verifica':'ognuna delle prossime '+S.k}`}
    else{need=fmtQ(x);lab='puoi scendere a';t='green';d=`Ora hai ${fmt(a)}, sotto questo voto scendi sotto ${fmt(S.target)}`}
    const pa=Math.max(0,Math.min(100,a*10)),pt=S.target*10;
    return `<div class="goal"><div class="ico" style="${icoStyle(s)}">${emojiOf(s.name)}</div><div><div class="n">${esc(s.name)}</div><div class="d">${d}</div></div>
    <div class="need"><span>${lab}</span><b class="t-${t}">${need}</b></div>
    <div class="track"><div class="fill" style="width:${pa}%;background:var(--${tone(a)})"></div><div class="tg" style="left:${pt}%"></div></div></div>`;
  };
  if(under.length)h+=`<div class="sechead"><h2>Da recuperare</h2></div><div class="list">${under.map(card).join('')}</div>`;
  if(over.length)h+=`<div class="sechead"><h2>Sopra l'obiettivo</h2></div><div class="list">${over.map(card).join('')}</div>`;
  return h;
}
function viewCrediti(){
  const per=perForCredit(),M=mediaScrutinio(),b=band(M,S.anno),hi=S.condotta[per]>=9;
  let msg='';
  if(b)msg=hi?`Con ${S.condotta[per]} in condotta puoi arrivare a ${b[1]}`:`Il punto più alto (${b[1]}) richiede almeno 9 in condotta`;
  else if(M!=null)msg='Con media sotto il 6 non c\'è credito';
  let h=`<section class="hero-c"><div class="k">Credito stimato, ${S.anno}° anno</div><div class="big">${b?b[0]+'–'+b[1]:'–'}</div>
  <div class="s">${M==null?'Inserisci dei voti per la stima':`Media da pagella circa ${fmt(M)}`}</div>${msg?`<div class="pill">${msg}</div>`:''}</section>`;
  h+=`<div class="card" style="margin-top:12px">${stepper('anno','Anno',' ',S.anno+'°')}${stepper('condotta','Voto in condotta',per+'° periodo',S.condotta[per])}</div>`;
  const tot=[3,4,5].reduce((t,y)=>t+(Number(S.crediti[y])||0),0),max={3:12,4:13,5:15};
  h+=`<div class="sechead"><h2>Crediti ottenuti</h2></div><div class="card"><div class="years">${[3,4,5].map(y=>`<label class="yr"><span>${y}° anno</span><input type="number" inputmode="numeric" min="0" max="${max[y]}" data-cred="${y}" value="${S.crediti[y]??''}" placeholder="–" aria-label="Crediti ${y}° anno"><small>su ${max[y]}</small></label>`).join('')}</div>
  <div class="total"><span style="font-weight:600">Totale</span><b>${tot}<span style="font-size:16px;color:var(--muted);font-weight:500"> / 40</span></b></div><div class="bar"><span style="width:${tot/40*100}%"></span></div></div>
  <p class="note">La stima usa le medie arrotondate di ogni materia${S.inclCondotta?' più la condotta':''} e la tabella ministeriale. Il credito vero lo decide il consiglio di classe.</p>`;
  h+=pagellaBlock();
  return h;
}
function bind(root){
  bindAgenda(root);
  const sp=root.querySelector('#sharePag');if(sp)sp.onclick=sharePagella;
  bindOrario(root);
  root.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{const n=b.dataset.quick;picked.has(n)?picked.delete(n):picked.add(n);render()});
  const po=root.querySelector('#pickOk');if(po)po.onclick=()=>{SUGGEST.filter(n=>picked.has(n)).forEach(n=>{const s={id:uid(),name:n,grades:[]};S.subjects.push(s);colorOf(s)});picked.clear();save();render();toast('Materie aggiunte')};
  root.querySelectorAll('#addSubjBtn').forEach(b=>b.onclick=openNewSubject);
  root.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openSubject(b.dataset.open));
  root.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{
    const d=+b.dataset.d,k=b.dataset.step,per=perForCredit();
    if(k==='target')S.target=Math.max(5,Math.min(10,S.target+d*.5));
    if(k==='k')S.k=Math.max(1,Math.min(6,S.k+d));
    if(k==='anno')S.anno=Math.max(3,Math.min(5,S.anno+d));
    if(k==='condotta')S.condotta[per]=Math.max(5,Math.min(10,S.condotta[per]+d));
    save();render();
  });
  root.querySelectorAll('[data-cred]').forEach(i=>i.onchange=()=>{const y=i.dataset.cred,mx=+i.max;S.crediti[y]=i.value===''?null:Math.max(0,Math.min(mx,Math.round(+i.value)));save();render();unlockNow()});
}
function addSubject(name){
  name=name.trim();if(!name)return false;
  if(S.subjects.some(s=>s.name.toLowerCase()===name.toLowerCase())){toast('C\'è già '+name);return false}
  const s={id:uid(),name,grades:[]};S.subjects.push(s);colorOf(s);save();render();return true;
}

function chart(s){
  const gs=gradesOf(s).filter(g=>!g.nm);if(gs.length<2)return'';
  const W=320,H=150,px=i=>18+i*((W-30)/(gs.length-1)),py=v=>H-14-(v-1)/9*(H-28);
  const pts=gs.map((g,i)=>[px(i),py(g.v)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
  const c=colorOf(s);
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Andamento dei voti">
  <defs><linearGradient id="gf" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".25"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs>
  ${[4,6,8,10].map(v=>`<line x1="10" x2="${W}" y1="${py(v)}" y2="${py(v)}" stroke="var(--edge)" stroke-width="1" ${v===6?'stroke-dasharray="4 4" stroke="var(--muted)" stroke-opacity=".6"':''}/><text x="0" y="${py(v)+4}" font-size="10" fill="var(--muted)">${v}</text>`).join('')}
  <path d="${line} L${pts[pts.length-1][0]} ${H} L${pts[0][0]} ${H} Z" fill="url(#gf)"/>
  <path d="${line}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--surface)" stroke="${c}" stroke-width="2.5"/>`).join('')}
  </svg></div>`;
}

function confetti(n,gold){
  const c=$('#confetti'),x=c.getContext('2d'),dpr=devicePixelRatio||1;
  c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.scale(dpr,dpr);
  const cols=gold?['#FFD43B','#FAB005','#12B886','#3D5AFE','#F783AC']:['#12B886','#3DDBA4','#3D5AFE','#FFD43B','#FF8787'];
  const ps=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*60,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.3,sh:Math.random()<.5}));
  let f=0;cancelAnimationFrame(c._r);
  const step=()=>{x.clearRect(0,0,innerWidth,innerHeight);f++;
    ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.globalAlpha=Math.max(0,1-f/150);x.fillStyle=p.c;
      if(p.sh){x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2)}else{x.beginPath();x.arc(0,0,p.r/2.4,0,7);x.fill()}x.restore()});
    if(f<150)c._r=requestAnimationFrame(step);else x.clearRect(0,0,innerWidth,innerHeight)};
  step();
}

const DAYN=['Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato','Domenica'];
function subjColorByName(name){
  const s=S.subjects.find(x=>x.name.toLowerCase()===name.toLowerCase())||S.subjects.find(x=>name.toLowerCase().startsWith(x.name.toLowerCase().slice(0,4)));
  if(s)return colorOf(s);
  let hsh=0;for(const ch of name.toLowerCase())hsh=(hsh*31+ch.charCodeAt(0))>>>0;return PALETTE[hsh%PALETTE.length];
}
const cellStyle=n=>{const c=subjColorByName(n);return`background:color-mix(in srgb,${c} 17%,transparent);color:color-mix(in srgb,${c} 70%,var(--text))`};
function todayIdx(){
  const d=new Date(),dow=(d.getDay()+6)%7;let i=dow,lab='Oggi';
  if(d.getHours()>=14||dow>=S.orario.giorni.length){i=dow+1;lab='Domani';}

  return{i,lab};
}

async function readOrario(file){
  openSheet(`<div class="scan"><div class="spin"></div><h3 style="margin:0;font-size:22px">Sto leggendo il tuo orario</h3><p class="note">Ci vuole qualche secondo</p></div>`);
  const sample=await getSample();
  const fail=t=>openSheet(`<div class="scan"><div class="em" style="font-size:40px">😕</div><h3 style="margin:8px 0 0;font-size:22px">${t}</h3><p class="note">Puoi riprovare con una foto più dritta e nitida, oppure crearlo a mano.</p></div><div class="row"><button class="btn soft press" id="fMan">Crea a mano</button><button class="btn press" id="fRe">Riprova</button></div>`)||(()=>{$('#fMan').onclick=()=>{S.orario=S.orario||blankOrario();save();closeSheet()};$('#fRe').onclick=()=>{closeSheet();startScan('cam')}})();
  if(!sample){fail('La lettura delle foto non è disponibile qui');return}
  try{
    const lim=await sample.limits().catch(()=>null);
    if(!lim||!lim.images){fail('La lettura delle foto non è disponibile qui');return}
    const known=S.subjects.map(s=>s.name).join(', ')||'nessuna';
    const prompt=`L'immagine è la foto dell'orario scolastico settimanale di uno studente di liceo italiano.
Estrai l'orario e rispondi SOLO con un oggetto JSON, senza testo prima o dopo, con questa forma:
{"giorni":["Lunedì",...],"ore":["8:00-9:00",...],"celle":[["materia del lunedì alla 1ª ora","materia del martedì alla 1ª ora",...], ...una riga per ogni ora]}
Regole: "giorni" contiene solo i giorni con lezioni, in ordine da lunedì. "celle" ha una riga per ora e in ogni riga un elemento per ogni giorno, "" se l'ora è libera. "ore" contiene gli orari se sono scritti, altrimenti è un array vuoto.
Scrivi le materie per esteso in italiano con l'iniziale maiuscola (es. MAT → Matematica, ING → Inglese, SC. MOT. → Scienze motorie). Ignora nomi dei professori e aule. Se la materia corrisponde a una di queste usa esattamente questo nome: ${known}.
Se l'immagine non è un orario rispondi {"errore":"non è un orario"}.`;
    const r=await sample.json(prompt,{images:[file],modelTier:'complex'});
    if(!r||r.errore||!Array.isArray(r.celle)||!Array.isArray(r.giorni)||!r.giorni.length){fail('Non sono riuscito a leggere un orario');return}
    const nd=Math.min(7,r.giorni.length);
    const celle=r.celle.filter(Array.isArray).map(row=>Array.from({length:nd},(_,j)=>String(row[j]||'').trim().slice(0,30)));
    while(celle.length&&celle[celle.length-1].every(c=>!c))celle.pop();
    if(!celle.length){fail('Non sono riuscito a leggere un orario');return}
    S.orario={giorni:r.giorni.slice(0,nd).map(String),ore:Array.isArray(r.ore)?r.ore.map(String).slice(0,celle.length):[],celle};
    save();tab='orario';render();
    const fresh=[...new Set(celle.flat().filter(Boolean))].filter(n=>!S.subjects.some(s=>s.name.toLowerCase()===n.toLowerCase()));
    if(fresh.length){
      openSheet(`<h3 style="margin:4px 0 6px;font-size:22px">Orario pronto 🎉</h3><p class="note" style="margin:0;font-size:15px">Ho trovato ${fresh.length===1?'una materia che non hai':fresh.length+' materie che non hai'} ancora tra i voti. Le aggiungo?</p>
      <div class="chips" style="justify-content:flex-start;margin-top:14px">${fresh.map(n=>`<span class="chip">${emojiOf(n)} ${esc(n)}</span>`).join('')}</div>
      <div class="row"><button class="btn soft press" id="aNo">No grazie</button><button class="btn press" id="aOk">Aggiungi</button></div>`);
      $('#aNo').onclick=closeSheet;$('#aOk').onclick=()=>{fresh.forEach(n=>{const s={id:uid(),name:n,grades:[]};S.subjects.push(s);colorOf(s)});save();closeSheet();toast('Materie aggiunte')};
    }else{closeSheet();toast('Orario pronto 🎉')}
  }catch(e){
    const c=e&&e.code;
    if(c==='not_granted'||c==='sampling_disabled')fail('La lettura delle foto non è attiva per questo account');
    else if(c==='rate_limited')fail('Troppe richieste, riprova tra poco');
    else if(c==='image_rejected')fail('Questa immagine non si riesce ad aprire');
    else fail('Non sono riuscito a leggere un orario');
  }
}

function neededFor(s,target,per){let w=0,v=0;s.grades.filter(g=>periodOf(g.date)===per).forEach(g=>{w+=g.w;v+=g.v*g.w});return w?(target*(w+100)-v)/100:null}

  return `<button class="ver press" data-ver="${t.id}"><div class="ico" style="${icoStyle(s)}">${emojiOf(s.name)}</div><div><div class="n">${esc(s.name)}</div><div class="d">${t.type}, ${new Date(t.date+'T12:00').toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})}${t.note?' · '+esc(t.note):''}</div>${need}</div><div class="cd ${n<=2?'soon':''}"><b>${a}</b><span>${b}</span></div></button>`;
}
const upcoming=()=>(S.verifiche||[]).filter(t=>!t.done&&daysTo(t.date)>=0&&S.subjects.some(s=>s.id===t.sid)).sort((a,b)=>a.date.localeCompare(b.date));
